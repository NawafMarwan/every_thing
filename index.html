<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>آيس غيم | Ice Ghym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --midnight:#0a1a2e;
    --midnight-deep:#061120;
    --ice-blue:#3fc5ff;
    --ice-blue-soft:#8fe0ff;
    --frost-white:#eaf6ff;
    --card-glass:rgba(255,255,255,0.05);
    --card-border:rgba(143,224,255,0.18);
    --juice-accent:#5fe0c4;
    --cream-accent:#3fc5ff;
    --price-gold:#ffd479;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    background:
      radial-gradient(ellipse 900px 500px at 20% 0%, rgba(63,197,255,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 20%, rgba(95,224,196,0.08), transparent 55%),
      var(--midnight-deep);
    color:var(--frost-white);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* ambient snow */
  .snowfield{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .flake{
    position:absolute;top:-5%;
    color:rgba(234,246,255,0.35);
    font-size:14px;
    animation:fall linear infinite;
    user-select:none;
  }
  @keyframes fall{
    to{transform:translateY(110vh) translateX(20px);}
  }

  header{
    position:relative;z-index:2;
    display:flex;flex-direction:column;align-items:center;
    padding:36px 20px 22px;
    text-align:center;
  }
  .logo-frame{
    width:min(560px, 92vw);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 0 40px rgba(63,197,255,0.35), 0 0 90px rgba(63,197,255,0.12);
    border:1px solid rgba(143,224,255,0.25);
  }
  .logo-frame img{width:100%;display:block;}

  .tagline{
    margin-top:18px;
    font-family:'Cairo',sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--ice-blue-soft);
    letter-spacing:0.5px;
  }

  nav.tabs{
    position:sticky;top:0;z-index:20;
    display:flex;justify-content:center;gap:10px;
    padding:14px 16px;
    backdrop-filter:blur(14px);
    background:rgba(6,17,32,0.72);
    border-bottom:1px solid rgba(143,224,255,0.12);
  }
  .tab-btn{
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--frost-white);
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(143,224,255,0.18);
    padding:10px 26px;
    border-radius:999px;
    cursor:pointer;
    transition:all .25s ease;
    display:flex;align-items:center;gap:8px;
  }
  .tab-btn .emoji{font-size:17px;}
  .tab-btn.active{
    background:linear-gradient(135deg, rgba(63,197,255,0.25), rgba(95,224,196,0.18));
    border-color:var(--ice-blue);
    box-shadow:0 0 18px rgba(63,197,255,0.35);
    color:#fff;
  }

  main{
    position:relative;z-index:2;
    max-width:980px;
    margin:0 auto;
    padding:28px 18px 140px;
  }

  .section-title{
    font-family:'Cairo',sans-serif;
    font-weight:800;
    font-size:22px;
    margin:6px 4px 18px;
    display:flex;align-items:center;gap:10px;
  }
  .section-title .bar{
    width:5px;height:22px;border-radius:4px;
    background:linear-gradient(180deg, var(--ice-blue), var(--juice-accent));
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:16px;
    margin-bottom:36px;
  }

  .card{
    background:var(--card-glass);
    border:1px solid var(--card-border);
    border-radius:18px;
    padding:18px 16px;
    display:flex;flex-direction:column;gap:12px;
    position:relative;
    backdrop-filter:blur(6px);
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:rgba(143,224,255,0.4);
    box-shadow:0 8px 26px rgba(0,0,0,0.35);
  }
  .card .icon-row{
    display:flex;align-items:center;justify-content:space-between;
  }
  .card .icon{
    font-size:30px;
    filter:drop-shadow(0 0 8px rgba(63,197,255,0.5));
  }
  .card .price{
    font-family:'Cairo',sans-serif;
    font-weight:800;
    font-size:16px;
    color:var(--price-gold);
    background:rgba(255,212,121,0.08);
    border:1px solid rgba(255,212,121,0.25);
    padding:4px 12px;
    border-radius:999px;
  }
  .card h3{
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:18px;
    color:#fff;
  }
  .card p.desc{
    font-size:13px;
    color:rgba(234,246,255,0.6);
    line-height:1.6;
    flex-grow:1;
  }

  .qty-row{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:auto;
  }
  .stepper{
    display:flex;align-items:center;gap:0;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(143,224,255,0.2);
    border-radius:999px;
    overflow:hidden;
  }
  .stepper button{
    width:34px;height:34px;
    border:none;background:transparent;
    color:var(--ice-blue-soft);
    font-size:18px;font-weight:700;
    cursor:pointer;
    transition:background .15s;
  }
  .stepper button:hover{background:rgba(63,197,255,0.15);}
  .stepper .count{
    width:32px;text-align:center;
    font-family:'Cairo',sans-serif;font-weight:700;font-size:15px;
  }
  .add-btn{
    font-family:'Cairo',sans-serif;font-weight:700;font-size:13px;
    color:var(--midnight-deep);
    background:linear-gradient(135deg, var(--ice-blue-soft), var(--ice-blue));
    border:none;border-radius:999px;
    padding:8px 16px;
    cursor:pointer;
    transition:filter .2s;
  }
  .add-btn:hover{filter:brightness(1.1);}
  .add-btn.in-cart{
    background:linear-gradient(135deg, var(--juice-accent), #3fc5ff);
  }

  /* cart bar */
  .cart-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    display:flex;justify-content:center;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, transparent, rgba(6,17,32,0.95) 25%);
    pointer-events:none;
  }
  .cart-inner{
    pointer-events:auto;
    width:100%;max-width:640px;
    background:rgba(10,26,46,0.9);
    border:1px solid rgba(143,224,255,0.3);
    border-radius:18px;
    box-shadow:0 10px 40px rgba(0,0,0,0.5), 0 0 30px rgba(63,197,255,0.15);
    padding:14px 18px;
    display:flex;align-items:center;justify-content:space-between;
    gap:14px;
    backdrop-filter:blur(10px);
    transition:transform .3s ease, opacity .3s ease;
  }
  .cart-inner.hidden{transform:translateY(140%);opacity:0;pointer-events:none;}
  .cart-info{display:flex;flex-direction:column;gap:2px;}
  .cart-info .label{font-size:12px;color:rgba(234,246,255,0.6);}
  .cart-info .total{
    font-family:'Cairo',sans-serif;font-weight:800;font-size:20px;color:#fff;
  }
  .cart-info .total span{color:var(--price-gold);}
  .checkout-btn{
    font-family:'Cairo',sans-serif;font-weight:800;font-size:15px;
    color:var(--midnight-deep);
    background:linear-gradient(135deg, var(--price-gold), #ffb84d);
    border:none;border-radius:14px;
    padding:13px 26px;
    cursor:pointer;
    box-shadow:0 4px 16px rgba(255,212,121,0.35);
    transition:transform .15s ease;
    white-space:nowrap;
  }
  .checkout-btn:active{transform:scale(0.96);}

  /* confirmation overlay */
  .overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(6,17,32,0.88);
    backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;
    transition:opacity .3s ease;
    padding:20px;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .confirm-card{
    width:min(380px, 92vw);
    background:linear-gradient(160deg, rgba(20,40,64,0.95), rgba(10,26,46,0.95));
    border:1px solid rgba(143,224,255,0.3);
    border-radius:24px;
    padding:36px 26px 30px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.5), 0 0 50px rgba(63,197,255,0.2);
    transform:scale(0.9);
    transition:transform .3s ease;
  }
  .overlay.show .confirm-card{transform:scale(1);}
  .confirm-icon{
    width:76px;height:76px;margin:0 auto 18px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(63,197,255,0.25), transparent 70%);
    display:flex;align-items:center;justify-content:center;
    font-size:38px;
    border:1px solid rgba(143,224,255,0.35);
  }
  .confirm-card h2{
    font-family:'Cairo',sans-serif;font-weight:800;font-size:21px;color:#fff;margin-bottom:8px;
  }
  .confirm-card p{
    font-size:14px;color:rgba(234,246,255,0.7);line-height:1.7;margin-bottom:22px;
  }
  .confirm-card .order-total{
    font-family:'Cairo',sans-serif;font-weight:700;font-size:15px;
    color:var(--price-gold);margin-bottom:22px;
  }
  .close-confirm{
    font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;
    color:var(--midnight-deep);
    background:linear-gradient(135deg, var(--ice-blue-soft), var(--ice-blue));
    border:none;border-radius:12px;
    padding:11px 24px;
    cursor:pointer;
    width:100%;
  }

  .empty-note{
    text-align:center;font-size:13px;color:rgba(234,246,255,0.45);
    padding:14px 0 6px;
  }

  /* waiter button + panel */
  .waiter-btn{
    position:fixed;top:16px;left:16px;z-index:25;
    display:flex;align-items:center;gap:8px;
    background:rgba(10,26,46,0.85);
    border:1px solid rgba(143,224,255,0.3);
    border-radius:999px;
    padding:9px 16px;
    font-family:'Cairo',sans-serif;font-weight:700;font-size:13px;
    color:var(--frost-white);
    cursor:pointer;
    backdrop-filter:blur(8px);
    box-shadow:0 4px 16px rgba(0,0,0,0.35);
  }
  .waiter-btn .badge{
    background:linear-gradient(135deg, var(--price-gold), #ffb84d);
    color:var(--midnight-deep);
    font-size:11px;font-weight:800;
    min-width:20px;height:20px;
    border-radius:999px;
    display:flex;align-items:center;justify-content:center;
    padding:0 5px;
  }

  .waiter-overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(6,17,32,0.9);
    backdrop-filter:blur(6px);
    display:flex;align-items:flex-start;justify-content:center;
    opacity:0;pointer-events:none;
    transition:opacity .3s ease;
    padding:60px 16px 20px;
    overflow-y:auto;
  }
  .waiter-overlay.show{opacity:1;pointer-events:auto;}
  .waiter-panel{
    width:min(520px, 94vw);
    background:linear-gradient(160deg, rgba(20,40,64,0.97), rgba(10,26,46,0.97));
    border:1px solid rgba(143,224,255,0.3);
    border-radius:22px;
    padding:24px 20px 26px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5), 0 0 50px rgba(63,197,255,0.15);
  }
  .waiter-panel-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:16px;
  }
  .waiter-panel-head h2{
    font-family:'Cairo',sans-serif;font-weight:800;font-size:19px;color:#fff;
    display:flex;align-items:center;gap:8px;
  }
  .waiter-close{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(143,224,255,0.2);
    color:var(--frost-white);
    width:32px;height:32px;border-radius:50%;
    cursor:pointer;font-size:16px;
  }
  .orders-list{display:flex;flex-direction:column;gap:12px;max-height:65vh;overflow-y:auto;}
  .order-item{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(143,224,255,0.15);
    border-radius:14px;
    padding:14px 16px;
  }
  .order-item .order-top{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:8px;
  }
  .order-item .order-num{
    font-family:'Cairo',sans-serif;font-weight:800;font-size:14px;color:var(--ice-blue-soft);
  }
  .order-item .order-time{
    font-size:11px;color:rgba(234,246,255,0.5);
  }
  .order-item ul{list-style:none;display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
  .order-item li{
    font-size:13px;color:rgba(234,246,255,0.85);
    display:flex;justify-content:space-between;
  }
  .order-item li span.qty{color:var(--price-gold);font-weight:700;}
  .order-item .order-bottom{
    display:flex;align-items:center;justify-content:space-between;
    border-top:1px dashed rgba(143,224,255,0.15);
    padding-top:8px;
  }
  .order-item .order-total-tag{
    font-family:'Cairo',sans-serif;font-weight:700;font-size:13px;color:var(--price-gold);
  }
  .status-tag{
    font-family:'Cairo',sans-serif;font-weight:700;font-size:11px;
    padding:4px 10px;border-radius:999px;
    background:rgba(95,224,196,0.15);
    color:var(--juice-accent);
    border:1px solid rgba(95,224,196,0.3);
    cursor:pointer;
  }
  .status-tag.done{
    background:rgba(255,255,255,0.06);
    color:rgba(234,246,255,0.5);
    border-color:rgba(143,224,255,0.15);
    text-decoration:line-through;
  }
  .no-orders{
    text-align:center;padding:40px 10px;
    color:rgba(234,246,255,0.45);font-size:14px;
  }

  @media (max-width:420px){
    .grid{grid-template-columns:repeat(auto-fill, minmax(160px,1fr));}
    .card h3{font-size:16px;}
  }
</style>
</head>
<body>

<div class="snowfield" id="snowfield"></div>

<button class="waiter-btn" onclick="openWaiterPanel()">
  📋 الفاتورة  <span class="badge" id="waiterBadge">0</span>
</button>

<div class="waiter-overlay" id="waiterOverlay">
  <div class="waiter-panel">
    <div class="waiter-panel-head">
      <h2>📋 قائمة الطلبات</h2>
      <button class="waiter-close" onclick="closeWaiterPanel()">✕</button>
    </div>
    <div class="orders-list" id="ordersList">
      <div class="no-orders">لا توجد طلبات حتى الآن</div>
    </div>
  </div>
</div>

  </div>
  <div class="tagline">طازج .. من أجلك 🍦 مكونات طبيعية وجودة عالية 🥤</div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-target="icecream" onclick="switchTab('icecream', this)">
    <span class="emoji">🍨</span> مثلجات
  </button>
  <button class="tab-btn" data-target="juices" onclick="switchTab('juices', this)">
    <span class="emoji">🥤</span> عصائر
  </button>
</nav>

<main>

  <section id="icecream">
    <div class="section-title"><span class="bar"></span> مثلجات</div>
    <div class="grid" id="icecream-grid"></div>
  </section>

  <section id="juices" style="display:none;">
    <div class="section-title"><span class="bar"></span> عصائر</div>
    <div class="grid" id="juices-grid"></div>
  </section>

</main>

<div class="cart-bar">
  <div class="cart-inner hidden" id="cartInner">
    <div class="cart-info">
      <span class="label" id="cartLabel">لا يوجد منتجات مختارة</span>
      <span class="total">الإجمالي: <span id="cartTotal">0</span> ريال</span>
    </div>
    <button class="checkout-btn" onclick="submitOrder()">تسليم الطلب ✅</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="confirm-card">
    <div class="confirm-icon">🚴‍♂️❄️</div>
    <h2>تم استلام طلبك!</h2>
    <p>طلبك الآن قيد التجهيز وهو في طريقه إليك بأسرع وقت ممكن. نتمنى لك تجربة منعشة مع آيس غيم 🧊</p>
    <div class="order-total">إجمالي الطلب: <span id="finalTotal">0</span> ريال</div>
    <button class="close-confirm" onclick="closeOverlay()">تم، شكراً</button>
  </div>
</div>

<script>
  const products = {
    icecream: [
      {id:'ic1', name:'غيم آيس كريم', desc:'الوصفة المميزة للمحل، نكهة كريمية غنية وقوام ناعم فاخر.', price:18, icon:'🍦'},
      {id:'ic2', name:'آيسكريم مانجو', desc:'مانجو طازجة بقوام كريمي ونكهة استوائية منعشة.', price:14, icon:'🥭'},
      {id:'ic3', name:'آيسكريم بطيخ', desc:'طعم البطيخ الصيفي الحقيقي في كل ملعقة.', price:13, icon:'🍉'},
      {id:'ic4', name:'آيسكريم استوائي', desc:'مزيج من الفواكه الاستوائية بنكهة غنية ومختلفة.', price:16, icon:'🍍'},
    ],
    juices: [
      {id:'j1', name:'جي', desc:'عصير طازج بلمسة كلاسيكية يناسب كل الأوقات.', price:10, icon:'🥤'},
      {id:'j2', name:'لمسات', desc:'مزيج فواكه متعددة بطعم متوازن ومنعش.', price:12, icon:'🍹'},
      {id:'j3', name:'غيم جوسي', desc:'عصيرنا المميز بوصفة غيم الخاصة، كثيف ولذيذ.', price:15, icon:'🧃'},
      {id:'j4', name:'آيس تي', desc:'شاي مثلج بارد ومنعش، مثالي في الأجواء الحارة.', price:8, icon:'🧊'},
    ]
  };

  const cart = {}; // id -> {name, price, qty}
  const orders = []; // submitted orders history for the waiter
  let orderCounter = 0;

  function renderProducts(){
    const icGrid = document.getElementById('icecream-grid');
    const juGrid = document.getElementById('juices-grid');
    icGrid.innerHTML = products.icecream.map(cardHTML).join('');
    juGrid.innerHTML = products.juices.map(cardHTML).join('');
  }

  function cardHTML(p){
    return `
      <div class="card" id="card-${p.id}">
        <div class="icon-row">
          <span class="icon">${p.icon}</span>
          <span class="price">${p.price} ﷼</span>
        </div>
        <h3>${p.name}</h3>
        <p class="desc">${p.desc}</p>
        <div class="qty-row">
          <div class="stepper">
            <button onclick="changeQty('${p.id}', -1)">−</button>
            <span class="count" id="count-${p.id}">0</span>
            <button onclick="changeQty('${p.id}', 1)">+</button>
          </div>
          <button class="add-btn" id="addbtn-${p.id}" onclick="changeQty('${p.id}', 1)">إضافة</button>
        </div>
      </div>`;
  }

  function findProduct(id){
    return products.icecream.find(p=>p.id===id) || products.juices.find(p=>p.id===id);
  }

  function changeQty(id, delta){
    const p = findProduct(id);
    if(!cart[id]) cart[id] = {name:p.name, price:p.price, qty:0};
    cart[id].qty = Math.max(0, cart[id].qty + delta);
    if(cart[id].qty === 0) delete cart[id];

    const countEl = document.getElementById('count-'+id);
    const btnEl = document.getElementById('addbtn-'+id);
    const qty = cart[id] ? cart[id].qty : 0;
    countEl.textContent = qty;
    btnEl.textContent = qty > 0 ? 'في السلة ✓' : 'إضافة';
    btnEl.classList.toggle('in-cart', qty > 0);

    updateCartBar();
  }

  function updateCartBar(){
    const ids = Object.keys(cart);
    const cartInner = document.getElementById('cartInner');
    const label = document.getElementById('cartLabel');
    const totalEl = document.getElementById('cartTotal');

    if(ids.length === 0){
      cartInner.classList.add('hidden');
      return;
    }
    cartInner.classList.remove('hidden');

    let totalQty = 0, totalPrice = 0;
    ids.forEach(id=>{
      totalQty += cart[id].qty;
      totalPrice += cart[id].qty * cart[id].price;
    });

    label.textContent = `${totalQty} منتج مختار`;
    totalEl.textContent = totalPrice;
  }

  function submitOrder(){
    const ids = Object.keys(cart);
    if(ids.length === 0) return;
    let totalPrice = 0;
    const items = ids.map(id=>{
      totalPrice += cart[id].qty * cart[id].price;
      return {name: cart[id].name, qty: cart[id].qty, price: cart[id].price};
    });

    orderCounter += 1;
    const now = new Date();
    const timeStr = now.toLocaleTimeString('ar-SA', {hour:'2-digit', minute:'2-digit'});
    orders.unshift({
      num: orderCounter,
      time: timeStr,
      items: items,
      total: totalPrice,
      done: false
    });
    renderWaiterPanel();

    document.getElementById('finalTotal').textContent = totalPrice;
    document.getElementById('overlay').classList.add('show');
  }

  function renderWaiterPanel(){
    const list = document.getElementById('ordersList');
    const badge = document.getElementById('waiterBadge');
    const pendingCount = orders.filter(o=>!o.done).length;
    badge.textContent = pendingCount;

    if(orders.length === 0){
      list.innerHTML = '<div class="no-orders">لا توجد طلبات حتى الآن</div>';
      return;
    }

    list.innerHTML = orders.map(o=>`
      <div class="order-item">
        <div class="order-top">
          <span class="order-num">طلب رقم #${o.num}</span>
          <span class="order-time">${o.time}</span>
        </div>
        <ul>
          ${o.items.map(it=>`<li><span>${it.name}</span><span class="qty">× ${it.qty}</span></li>`).join('')}
        </ul>
        <div class="order-bottom">
          <span class="order-total-tag">الإجمالي: ${o.total} ريال</span>
          <span class="status-tag ${o.done ? 'done':''}" onclick="toggleOrderStatus(${o.num})">
            ${o.done ? 'تم التجهيز ✓' : 'قيد التجهيز'}
          </span>
        </div>
      </div>
    `).join('');
  }

  function toggleOrderStatus(num){
    const order = orders.find(o=>o.num === num);
    if(order){
      order.done = !order.done;
      renderWaiterPanel();
    }
  }

  function openWaiterPanel(){
    document.getElementById('waiterOverlay').classList.add('show');
  }
  function closeWaiterPanel(){
    document.getElementById('waiterOverlay').classList.remove('show');
  }

  function closeOverlay(){
    document.getElementById('overlay').classList.remove('show');
    // reset cart after confirmation
    Object.keys(cart).forEach(id=>{
      delete cart[id];
      const countEl = document.getElementById('count-'+id);
      const btnEl = document.getElementById('addbtn-'+id);
      if(countEl) countEl.textContent = 0;
      if(btnEl){ btnEl.textContent = 'إضافة'; btnEl.classList.remove('in-cart'); }
    });
    updateCartBar();
  }

  function switchTab(target, btn){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('icecream').style.display = target === 'icecream' ? 'block' : 'none';
    document.getElementById('juices').style.display = target === 'juices' ? 'block' : 'none';
  }

  function initSnow(){
    const field = document.getElementById('snowfield');
    const flakes = ['❄','❅','❆'];
    for(let i=0;i<26;i++){
      const el = document.createElement('span');
      el.className = 'flake';
      el.textContent = flakes[i % flakes.length];
      el.style.left = Math.random()*100 + '%';
      el.style.fontSize = (10 + Math.random()*14) + 'px';
      el.style.opacity = 0.15 + Math.random()*0.35;
      const duration = 14 + Math.random()*18;
      el.style.animationDuration = duration + 's';
      el.style.animationDelay = (-Math.random()*duration) + 's';
      field.appendChild(el);
    }
  }

  renderProducts();
  initSnow();
</script>

</body>
</html>
