<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#34504A">
<title>مسار المذاكرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* مسار المذاكرة — أنماط الموقع (ألوان هادئة مريحة للعين) */
:root {
  --bg: #F5F2EB;
  --bg-2: #EDE8DD;
  --surface: #FFFDF9;
  --text: #2B3634;
  --muted: #74807D;
  --line: #E4DED2;
  --head: #34504A;
  --head-2: #47665F;
  --head-text: #F3EFE6;
  --accent: #C39A55;
  --ok: #5F9C80;
  --late: #C97866;
  --warn: #D2A05A;
  --focus: #C39A55;
  --shadow: 0 1px 2px rgba(52, 60, 55, .05), 0 6px 20px rgba(52, 60, 55, .06);
  --radius: 20px;
  --nav-h: 68px;
  --font: 'Tajawal', 'Segoe UI', Tahoma, system-ui, sans-serif;
  --font-display: 'El Messiri', 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151B1A;
    --bg-2: #111615;
    --surface: #1D2524;
    --text: #E4E9E6;
    --muted: #93A19D;
    --line: #2C3836;
    --head: #1B2B28;
    --head-2: #243A35;
    --head-text: #E9EEEA;
    --accent: #D6B06C;
    --ok: #74B596;
    --late: #DB8C7A;
    --warn: #E0B06A;
    --focus: #D6B06C;
    --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 8px 24px rgba(0, 0, 0, .22);
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(1200px 500px at 100% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, color-mix(in srgb, var(--ok) 10%, transparent), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.7;
}
a { color: inherit; text-decoration: none; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* ---------- الشريط العلوي والتنقل ---------- */
#chrome { position: sticky; top: 0; z-index: 20; }
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: calc(10px + env(safe-area-inset-top)) 18px 10px;
  background: linear-gradient(135deg, var(--head), var(--head-2));
  color: var(--head-text);
  box-shadow: 0 4px 18px rgba(30, 45, 40, .18);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 22px; }
.tabs { display: flex; gap: 6px; }
.tabs a {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px; border-radius: 99px; font-weight: 500; font-size: 16px;
  color: rgba(243, 239, 230, .75); transition: background .2s, color .2s;
}
.tabs a:hover { background: rgba(255, 255, 255, .08); color: #fff; }
.tabs a.on { background: rgba(255, 255, 255, .16); color: #fff; }

main { max-width: 820px; margin: 0 auto; padding: 18px 16px 48px; }
main > * { animation: rise .45s ease both; }
main > *:nth-child(2) { animation-delay: .05s; }
main > *:nth-child(3) { animation-delay: .1s; }
main > *:nth-child(4) { animation-delay: .15s; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

@media (max-width: 759px) {
  .tabs {
    position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 30;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    padding: 6px; border-radius: 22px;
    background: color-mix(in srgb, var(--head) 94%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 8px 28px rgba(20, 30, 28, .28);
  }
  .tabs a { flex-direction: column; gap: 2px; padding: 6px 0; font-size: 13px; border-radius: 16px; }
  main { padding-bottom: calc(var(--nav-h) + 40px + env(safe-area-inset-bottom)); }
}

/* ---------- حالات الأيام (متغير --sc) ---------- */
.s-done { --sc: var(--ok); }
.s-partial-late { --sc: var(--warn); }
.s-missed { --sc: var(--late); }
.s-partial, .s-today { --sc: var(--accent); }
.s-future { --sc: var(--line); }
.s-off { --sc: var(--line); }

/* ---------- العبارة التشجيعية ---------- */
.quote {
  position: relative; overflow: hidden;
  margin-bottom: 16px; padding: 18px 20px 16px;
  border-radius: var(--radius);
  background: linear-gradient(135deg,
    color-mix(in srgb, var(--accent) 16%, var(--surface)),
    color-mix(in srgb, var(--ok) 14%, var(--surface)));
  border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line));
  box-shadow: var(--shadow);
}
.quote::before {
  content: '”'; position: absolute; top: -34px; left: 12px;
  font-family: Georgia, serif; font-size: 150px; line-height: 1;
  color: color-mix(in srgb, var(--accent) 30%, transparent); pointer-events: none;
}
.q-greet { display: block; color: var(--muted); font-size: 15px; font-weight: 500; }
.q-text {
  position: relative; margin: 6px 0 10px;
  font-family: var(--font-display); font-size: 21px; font-weight: 600; line-height: 1.75;
  transition: opacity .25s;
}
.q-text.fade { opacity: 0; }
.q-more {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 14px; border-radius: 99px; font-size: 14px;
  border: 1px solid color-mix(in srgb, var(--text) 18%, transparent);
  background: color-mix(in srgb, var(--surface) 60%, transparent); color: var(--muted);
}
.q-more:hover { color: var(--text); border-color: var(--accent); }

/* ---------- صفحة اليوم ---------- */
.banner {
  margin-bottom: 14px; padding: 13px 18px; border-radius: 16px;
  background: color-mix(in srgb, var(--accent) 12%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
  font-weight: 500;
}
.hero {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px 16px 20px;
  box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; inset: 0 0 auto 0; height: 5px;
  background: var(--sc, var(--line));
}
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hero-date { text-align: center; }
.hero-date h1 { font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1.35; }
.hero-date p { color: var(--muted); font-size: 15px; line-height: 1.5; }
.hero-date p.hj { font-size: 14px; opacity: .85; }
.step {
  width: 46px; height: 46px; display: grid; place-items: center;
  border-radius: 50%; background: color-mix(in srgb, var(--muted) 10%, transparent);
  font-size: 26px; line-height: 1; color: var(--muted); transition: background .2s, color .2s;
}
.step:hover { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--text); }
.step[aria-disabled="true"] { opacity: .25; pointer-events: none; }
.hero-meta { display: flex; justify-content: space-between; align-items: baseline; margin: 12px 4px 8px; color: var(--muted); font-size: 15px; }
.hero-meta strong { color: var(--text); font-size: 20px; font-weight: 700; }

.bar { height: 10px; border-radius: 99px; background: color-mix(in srgb, var(--muted) 16%, transparent); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--c, var(--ok)); transition: width .5s ease; }
.hero .bar i { background: linear-gradient(90deg, var(--ok), color-mix(in srgb, var(--ok) 70%, var(--accent))); }

.wk { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 14px 0; }
.wk-d {
  display: flex; flex-direction: column; align-items: center; padding: 8px 2px 10px;
  border-radius: 16px; background: var(--surface); border: 1px solid var(--line);
  position: relative; transition: transform .15s, box-shadow .15s;
}
.wk-d::after {
  content: ''; position: absolute; bottom: 6px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--sc, var(--line));
}
.wk-d:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.wk-d small { color: var(--muted); font-size: 13px; line-height: 1.4; }
.wk-d b { font-size: 20px; line-height: 1.3; margin-bottom: 8px; }
.wk-d.cur { background: var(--head); border-color: var(--head); color: var(--head-text); }
.wk-d.cur small { color: rgba(243, 239, 230, .75); }
@media (prefers-color-scheme: dark) { .wk-d.cur { border-color: var(--accent); } }
.wk-d.s-off::after { background: transparent; border: 1.5px dashed var(--muted); }

.panel {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden; margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.panel > .ph { padding: 16px 20px 6px; font-family: var(--font-display); font-size: 22px; }

.task {
  display: flex; align-items: center; gap: 14px; position: relative;
  min-height: 70px; padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  cursor: pointer; transition: background .15s;
}
.task::before {
  content: ''; position: absolute; inset-inline-start: 0; top: 14px; bottom: 14px;
  width: 4px; border-radius: 0 4px 4px 0; background: var(--c);
}
.task:hover { background: color-mix(in srgb, var(--c) 6%, transparent); }
.panel > .task:last-child, .day > .task:last-child { border-bottom: 0; }
.task input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.box {
  flex: none; width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--c); background: transparent; position: relative;
  transition: background .2s, transform .2s;
}
.task input:checked + .box { background: var(--c); animation: pop .3s ease; }
.task input:checked + .box::after {
  content: ''; position: absolute; inset: 5px 9px 8px 9px;
  border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(40deg);
}
@keyframes pop { 50% { transform: scale(1.18); } }
.task input:focus-visible + .box { outline: 3px solid var(--focus); outline-offset: 3px; }
.tx { display: flex; flex-direction: column; min-width: 0; }
.tx b { font-size: 18px; line-height: 1.4; }
.tx span { color: var(--muted); font-size: 16px; line-height: 1.55; }
.tx em { font-style: normal; color: var(--late); font-size: 14px; }
.task.is-done .tx b, .task.is-done .tx span { opacity: .5; text-decoration: line-through; text-decoration-thickness: 1px; }

.all-done {
  padding: 14px 18px; text-align: center; color: var(--ok); font-weight: 700;
  background: color-mix(in srgb, var(--ok) 10%, transparent);
}
.empty { padding: 24px 18px; text-align: center; color: var(--muted); }
.foot { color: var(--muted); font-size: 14px; text-align: center; margin-top: 10px; opacity: .85; }

details.late { border-color: color-mix(in srgb, var(--late) 35%, var(--line)); }
details > summary { list-style: none; cursor: pointer; padding: 14px 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: '⌄'; margin-inline-start: auto; color: var(--muted); }
details[open] > summary::after { content: '⌃'; }
details.late summary span {
  min-width: 26px; padding: 0 8px; text-align: center; border-radius: 99px;
  background: var(--late); color: #fff; font-size: 14px;
}
details.late > .task:last-child { border-bottom: 0; }

/* ---------- صفحة الجدول ---------- */
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.chip {
  --c: var(--text);
  padding: 6px 16px; min-height: 40px; border-radius: 99px;
  border: 1.5px solid color-mix(in srgb, var(--c) 55%, transparent);
  background: var(--surface); font-weight: 500; font-size: 15px; transition: background .2s, color .2s;
}
.chip:hover { background: color-mix(in srgb, var(--c) 10%, var(--surface)); }
.chip.on { background: var(--c); border-color: var(--c); color: var(--bg); }
.week { margin-bottom: 28px; }
.week h2 {
  display: flex; align-items: baseline; gap: 10px; padding: 0 4px 10px;
  font-family: var(--font-display); font-size: 23px;
}
.week h2 small { color: var(--muted); font-family: var(--font); font-size: 15px; font-weight: 400; }
.wprog {
  margin-inline-start: auto; color: var(--muted); font-family: var(--font); font-size: 14px;
  padding: 0 10px; border-radius: 99px; background: color-mix(in srgb, var(--muted) 12%, transparent);
}
.day {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 18px; overflow: hidden; margin-bottom: 12px; scroll-margin-top: 84px;
  box-shadow: var(--shadow);
}
.day > header {
  display: flex; align-items: center; justify-content: space-between; padding: 10px 18px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(90deg, color-mix(in srgb, var(--sc, var(--line)) 16%, var(--surface)), var(--surface));
}
.day h3 { font-size: 17px; font-weight: 700; }
.day[data-today] { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.chip-s {
  padding: 1px 12px; border-radius: 99px; font-size: 13px;
  border: 1.5px solid var(--sc, var(--line)); color: var(--text);
}
.chip-s.s-done, .chip-s.s-missed { background: var(--sc); border-color: var(--sc); color: #fff; }

/* ---------- صفحة الإحصاءات ---------- */
.sum { display: flex; align-items: center; gap: 22px; padding: 22px; }
.sum-ring { flex: none; width: 140px; }
.ring { width: 100%; height: auto; display: block; }
.ring-bg { fill: none; stroke: color-mix(in srgb, var(--muted) 16%, transparent); stroke-width: 11; }
.ring-fg { fill: none; stroke: var(--ok); stroke-width: 11; stroke-linecap: round; transition: stroke-dasharray .6s; }
.ring-t { fill: var(--text); font-family: var(--font-display); font-size: 26px; font-weight: 700; }
.sum-tx h1 { font-family: var(--font-display); font-size: 26px; }
.sum-tx p { color: var(--muted); }
.status { margin-top: 6px; font-weight: 700; }
.status.good { color: var(--ok); }
.status.bad { color: var(--late); }

.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
.kpi {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 14px 18px; display: flex; flex-direction: column; box-shadow: var(--shadow);
}
.kpi b { font-family: var(--font-display); font-size: 28px; line-height: 1.4; }
.kpi span { color: var(--muted); font-size: 15px; }

.crs { padding: 12px 20px; border-bottom: 1px solid var(--line); }
.crs:last-child { border-bottom: 0; }
.crs-h { display: flex; justify-content: space-between; margin-bottom: 6px; }
.crs small { color: var(--muted); font-size: 14px; }

.wbars { display: flex; gap: 8px; padding: 10px 16px 4px; align-items: flex-end; }
.wb { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.wb-col { width: 100%; max-width: 40px; height: 110px; display: flex; align-items: flex-end; background: color-mix(in srgb, var(--muted) 12%, transparent); border-radius: 10px; overflow: hidden; }
.wb-col i { display: block; width: 100%; background: linear-gradient(0deg, var(--ok), color-mix(in srgb, var(--ok) 60%, var(--accent))); border-radius: 10px; }
.wb b { font-size: 14px; }
.wb small { color: var(--muted); font-size: 13px; }
.wb.fut b { color: var(--muted); font-weight: 400; }
.legend-note { padding: 4px 20px 14px; color: var(--muted); font-size: 14px; }

.grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 0 16px 8px; }
.grid5.head { padding-top: 6px; text-align: center; color: var(--muted); }
.grid5.head small { font-size: 13px; }
.cell {
  display: grid; place-items: center; aspect-ratio: 1.25; border-radius: 12px;
  background: color-mix(in srgb, var(--sc) 20%, var(--surface));
  border: 1.5px solid var(--sc); font-weight: 700;
}
.cell.s-done { background: var(--ok); color: #fff; }
.cell.s-missed { background: var(--late); color: #fff; }
.cell.s-future, .cell.s-off { background: transparent; color: var(--muted); font-weight: 400; }
.cell.s-off { border-style: dashed; }
.cell.now { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 6px 0 0; padding: 8px 20px 16px; font-size: 14px; color: var(--muted); }
.legend li::before { content: ''; display: inline-block; width: 12px; height: 12px; margin-inline-end: 6px; border-radius: 50%; background: var(--sc); vertical-align: -1px; }
.legend li.s-future::before, .legend li.s-off::before { background: transparent; border: 2px solid var(--line); }

.data > p { padding: 0 20px; color: var(--muted); font-size: 15px; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 20px 20px; }
.btn { padding: 10px 18px; min-height: 44px; border-radius: 99px; border: 1.5px solid color-mix(in srgb, var(--text) 40%, transparent); background: transparent; font-weight: 500; }
.btn:hover { background: color-mix(in srgb, var(--text) 7%, transparent); }
.btn.danger { border-color: var(--late); color: var(--late); }

#toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 30px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
  max-width: min(92vw, 460px); padding: 12px 20px; border-radius: 99px;
  background: var(--head); color: #fff; font-size: 15px; text-align: center;
  box-shadow: 0 8px 24px rgba(20, 30, 28, .25);
  opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 40;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 760px) { #toast { bottom: 24px; } }

/* ---------- الشاشات الأكبر ---------- */
@media (min-width: 760px) {
  main { padding-top: 28px; }
  .kpis { grid-template-columns: repeat(4, 1fr); }
  .hero { padding: 20px 22px 24px; }
  .hero-date h1 { font-size: 48px; }
  .sum-ring { width: 170px; }
  .quote { padding: 22px 26px 18px; }
  .q-text { font-size: 23px; }
}
@media (max-width: 380px) {
  body { font-size: 16px; }
  .hero-date h1 { font-size: 34px; }
  .q-text { font-size: 19px; }
  .sum { flex-direction: column; text-align: center; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

</style>
</head>
<body data-page="today">
<div id="chrome"></div>
<main id="view"><noscript><div class="banner">يحتاج الموقع إلى تفعيل JavaScript ليعمل.</div></noscript></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ===========================================================
   بيانات الجدول — عدّل هذا الملف فقط لتغيير المهام أو الأيام.
   ملاحظة: معرّف كل مهمة = تاريخ اليوم + ترتيبها داخل اليوم،
   فلا تُغيّر ترتيب مهام أيام بدأت بتأشير إنجازها.
   م = رقم المحاضرة في قائمة يوتيوب الخاصة بالمقرر.
   محاضرات الإحصاء (1–14) مبنية على افتراض أن آخر 3 محاضرات
   من أصل 17 هي المستثناة (السلاسل الزمنية والوحدة الرابعة).
   =========================================================== */
(function () {
  'use strict';

  var courses = {
    stats: { name: 'مبادئ الإحصاء',                        short: 'الإحصاء',       color: '#5B87C0' },
    bus:   { name: 'مبادئ إدارة الأعمال',                  short: 'إدارة الأعمال', color: '#C9974A' },
    eth:   { name: 'أخلاقيات منظمات الأعمال',              short: 'الأخلاقيات',    color: '#9A77B3' },
    comp:  { name: 'مهارات الحاسوب',                       short: 'الحاسوب',       color: '#4A9C9E' },
    quran: { name: 'مهارات تلاوة القرآن الكريم وتجويده',   short: 'التلاوة',       color: '#5E9E73' },
    all:   { name: 'مراجعة واستدراك',                      short: 'مراجعة',        color: '#8A9794' }
  };

  function lec(c, n, text) {
    var def;
    if (c === 'comp') def = 'المحاضرة ' + n + ' + قراءة ≈ 20 صفحة وتطبيق عملي';
    else if (c === 'quran') def = 'المحاضرة ' + n + ' (≈ ساعتان)';
    else def = 'المحاضرة ' + n + ' + قراءة الصفحات المقابلة وتلخيص';
    return { c: c, k: 'lec', n: n, text: text || def };
  }
  function rev(c, text) { return { c: c, k: 'rev', text: text }; }

</script>
<script>
(function () {
  'use strict';

  var ST = window.STUDY;
  var DAYS = ST.days;
  var COURSES = ST.courses;
  var START = DAYS[0].date;
  var LAST = DAYS[DAYS.length - 1].date;
  var MAIN = ['stats', 'bus', 'eth', 'comp', 'quran'];

  var WD = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  var MON = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];

  /* ---------- التاريخ ---------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function today() { return fmt(new Date()); }
  function dayDiff(a, b) { return Math.round((parse(a) - parse(b)) / 864e5); }
  function longDate(s) { var d = parse(s); return WD[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; }
  function shortRange(a, b) {
    var x = parse(a), y = parse(b);
    if (x.getMonth() === y.getMonth()) return x.getDate() + '–' + y.getDate() + ' ' + MON[x.getMonth()];
    return x.getDate() + ' ' + MON[x.getMonth()] + ' – ' + y.getDate() + ' ' + MON[y.getMonth()];
  }
  function hijri(s) {
    try {
      return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' }).format(parse(s));
    } catch (e) { return ''; }
  }
  function inDays(n) {
    if (n === 1) return 'غدًا';
    if (n === 2) return 'بعد يومين';
    if (n <= 10) return 'بعد ' + n + ' أيام';
    return 'بعد ' + n + ' يومًا';
  }
  function relLabel(s) {
    var n = dayDiff(s, today());
    if (n === 0) return 'اليوم';
    if (n === 1) return 'غدًا';
    if (n === -1) return 'أمس';
    return '';
  }
  function weekIdx(s) { return Math.floor(dayDiff(s, START) / 7); }
  function weekName(w) { return ST.weekNames[w] || ('الأسبوع ' + (w + 1)); }

  /* ---------- الحفظ ---------- */
  var KEY = 'masar-study-v2';
  var S = load();
  function load() {
    try {
      var o = JSON.parse(localStorage.getItem(KEY));
      if (o && o.done && typeof o.done === 'object') return o;
    } catch (e) {}
    return { done: {} };
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { toast('تعذّر الحفظ في هذا المتصفح. تأكد أن التصفح الخاص غير مفعّل.'); }
  }
  function isDone(id) { return !!S.done[id]; }
  function toggle(id) {
    if (S.done[id]) delete S.done[id]; else S.done[id] = today();
    persist();
  }

  /* ---------- حسابات ---------- */
  function dayStat(d) {
    var n = 0;
    d.tasks.forEach(function (t) { if (isDone(t.id)) n++; });
    return { t: d.tasks.length, n: n };
  }
  function dayState(d) {
    var s = dayStat(d), td = today();
    if (!s.t) return 'off';
    if (s.n === s.t) return 'done';
    if (d.date < td) return s.n ? 'partial-late' : 'missed';
    if (d.date === td) return s.n ? 'partial' : 'today';
    return 'future';
  }
  var STATE_TEXT = {
    'done': 'مكتمل', 'partial-late': 'ناقص', 'missed': 'متأخر', 'partial': 'قيد الإنجاز',
    'today': 'اليوم', 'future': 'قادم', 'off': 'إجازة'
  };
  function allTasks() {
    var out = [];
    DAYS.forEach(function (d) { d.tasks.forEach(function (t) { out.push({ t: t, d: d }); }); });
    return out;
  }
  function overdue() {
    var td = today();
    return allTasks().filter(function (x) { return x.d.date < td && !isDone(x.t.id); });
  }
  function streaks() {
    var td = today();
    var list = DAYS.filter(function (d) { return d.tasks.length && d.date <= td; });
    function full(d) { return dayStat(d).n === d.tasks.length; }
    var best = 0, run = 0;
    list.forEach(function (d) {
      if (full(d)) { run++; if (run > best) best = run; } else run = 0;
    });
    var i = list.length - 1;
    if (i >= 0 && list[i].date === td && !full(list[i])) i--;
    var cur = 0;
    while (i >= 0 && full(list[i])) { cur++; i--; }
    return { cur: cur, best: best };
  }

  /* ---------- عناصر مشتركة ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function toast(msg) {
    var t = $('#toast'); if (!t) return;
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.h);
    toast.h = setTimeout(function () { t.classList.remove('show'); }, 3200);
  }

  /* ---------- عبارات تشجيعية (تتغير مع كل زيارة) ---------- */
  var QUOTES = [
    'خطوة صغيرة كل يوم تصنع فرقًا كبيرًا في آخر الفصل.',
    '﴿وَقُل رَّبِّ زِدْنِي عِلْمًا﴾',
    'لست مضطرًا أن تكون مثاليًا، يكفي أن تكون مستمرًا.',
    'تعبك اليوم هو راحتك يوم النتائج.',
    'محاضرة واحدة اليوم أفضل من خمس مؤجلة إلى الغد.',
    '﴿إِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ مَنْ أَحْسَنَ عَمَلًا﴾',
    'ابدأ الآن؛ فالبداية نصف الطريق.',
    'لا تنتظر الحماس، ابدأ وسيلحق بك.',
    'ركّز على التقدّم، لا على الكمال.',
    '«من سلك طريقًا يلتمس فيه علمًا، سهّل الله له به طريقًا إلى الجنة»',
    'ساعة تركيز خير من يوم كامل مشتّت.',
    'الأيام ستمضي على كل حال، فاجعلها تمضي وأنت تتقدّم.',
    'إذا تعبت فاسترح قليلًا، لكن لا تستسلم.',
    '﴿فَإِنَّ مَعَ الْعُسْرِ يُسْرًا﴾',
    'كل مهمة تنجزها اليوم هدية تقدّمها لنفسك يوم الاختبار.',
    'ما دمت تحاول، فأنت لم تفشل.',
    'القليل الدائم خير من الكثير المنقطع.',
    'اجعل نسختك بعد شهرين تفخر بما فعلته اليوم.',
    'العلم صيد والكتابة قيده؛ لخّص ما تتعلمه.',
    'الهدف بعيد؟ اقترب منه محاضرة بعد محاضرة.',
    'النجاح مجموع جهود صغيرة تتكرر يومًا بعد يوم.',
    'أنت أقرب إلى هدفك مما تظن.',
    'الانضباط أن تفعل ما يجب حتى حين لا ترغب.',
    'من جدّ وجد، ومن زرع حصد.',
    'لا تقارن بدايتك بنهاية غيرك.',
    'ابدأ بالأصعب وأنت في كامل نشاطك، والباقي سيكون أسهل.',
    '﴿وَأَن لَّيْسَ لِلْإِنسَانِ إِلَّا مَا سَعَىٰ﴾',
    'يوم واحد منجز يكفي ليغيّر مزاج أسبوعك كله.'
  ];
  var PRAISE = [
    'أحسنت! خطوة أقرب 👏', 'رائع، استمر! 🌿', 'إنجاز جميل ✨', 'ممتاز، واصل هكذا 💪',
    'بارك الله في جهدك 🤍', 'مهمة أقل، هدف أقرب 🎯'
  ];
  var QKEY = 'masar-quote-last';
  var quoteIdx = pickQuote();
  function pickQuote() {
    var last = -1;
    try { last = Number(localStorage.getItem(QKEY)); } catch (e) {}
    var i;
    do { i = Math.floor(Math.random() * QUOTES.length); } while (i === last && QUOTES.length > 1);
    try { localStorage.setItem(QKEY, String(i)); } catch (e) {}
    return i;
  }
  function greeting() {
    var h = new Date().getHours();
    if (h >= 4 && h < 12) return 'صباح الخير والهمّة';
    if (h >= 12 && h < 17) return 'مساء النشاط';
    return 'مساء الخير، ما زال في اليوم متّسع';
  }
  function quoteCard() {
    return '<section class="quote" aria-label="عبارة تشجيعية"><span class="q-greet">' + greeting() + '</span>' +
      '<p class="q-text">' + QUOTES[quoteIdx] + '</p>' +
      '<button class="q-more" data-act="quote">عبارة أخرى ↻</button></section>';
  }
  function nextQuote() {
    var el = $('.q-text'); if (!el) return;
    quoteIdx = pickQuote();
    el.classList.add('fade');
    setTimeout(function () { el.textContent = QUOTES[quoteIdx]; el.classList.remove('fade'); }, 220);
  }

  var ICONS = {
    today: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17M9 15l2 2 4-4"/></svg>',
    schedule: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>',
    stats: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>'
  };
  var MARK = '<svg viewBox="0 0 28 28" width="28" height="28" aria-hidden="true"><rect x="2" y="17" width="6" height="9" rx="1.5" fill="#B8862B"/><rect x="11" y="10" width="6" height="16" rx="1.5" fill="#EAF3F0"/><rect x="20" y="3" width="6" height="23" rx="1.5" fill="#2B9A72"/></svg>';

  function chrome(page) {
    var links = [
      ['today', '#today', 'اليوم'],
      ['schedule', '#schedule', 'الجدول'],
      ['stats', '#stats', 'الإحصاءات']
    ];
    $('#chrome').innerHTML =
      '<header class="top"><a class="brand" href="#today">' + MARK + '<span>مسار المذاكرة</span></a>' +
      '<nav class="tabs" aria-label="التنقل الرئيسي">' +
      links.map(function (l) {
        return '<a href="' + l[1] + '"' + (l[0] === page ? ' class="on" aria-current="page"' : '') + '>' + ICONS[l[0]] + '<span>' + l[2] + '</span></a>';

      '</nav></header>';
  }

  function taskRow(t, note) {
    var c = COURSES[t.c], done = isDone(t.id);
    return '<label class="task' + (done ? ' is-done' : '') + '" style="--c:' + c.color + '">' +
      '<input type="checkbox" data-id="' + t.id + '"' + (done ? ' checked' : '') + '>' +
      '<span class="box" aria-hidden="true"></span>' +

  /* ---------- صفحة اليوم ---------- */
  function defaultDate() {
    var td = today(), d = DAYS.filter(function (x) { return x.date === td; })[0];

    d = DAYS.filter(function (x) { return x.date > td; })[0];
    return d ? d.date : LAST;
  }
  function route() {
    var p = location.hash.replace(/^#\/?/, '').split('/');
    var pg = ['today', 'schedule', 'stats'].indexOf(p[0]) >= 0 ? p[0] : 'today';
    return { page: pg, date: p[1] || '' };
  }
  function getSel() {
    var h = route().date;
    return DAYS.some(function (d) { return d.date === h; }) ? h : defaultDate();
  }

  function renderToday() {
    var sel = getSel(), td = today();
    var i = DAYS.findIndex(function (d) { return d.date === sel; });
    var d = DAYS[i], st = dayStat(d);
    var pct = st.t ? Math.round(st.n * 100 / st.t) : 0;

    var banner = '';
    if (td < START) banner = 'يبدأ الجدول ' + longDate(START) + ' — ' + inDays(dayDiff(START, td)) + '.';
    else if (td > LAST) banner = 'انتهى الجدول. أكمل ما تبقّى ثم ابدأ المراجعة الشاملة قبل الاختبارات.';
    else if (!route().date && !DAYS.some(function (x) { return x.date === td; })) banner = 'اليوم راحة بلا مهام. المهام التالية: ' + longDate(sel) + '.';

    var rel = relLabel(sel);
    var w = weekIdx(sel);
    var week = DAYS.filter(function (x) { return weekIdx(x.date) === w; });
    var hj = hijri(sel);

    var html = quoteCard();
    if (banner) html += '<div class="banner">' + banner + '</div>';

    html += '<section class="hero s-' + dayState(d) + '">' +
      '<div class="hero-top"><a class="step" href="' + (i > 0 ? '#today/' + DAYS[i - 1].date : '#today/' + sel) + '" aria-label="اليوم السابق"' + (i === 0 ? ' aria-disabled="true"' : '') + '>‹</a>' +
      '<div class="hero-date"><h1>' + WD[parse(sel).getDay()] + '</h1>' +
      '<p>' + parse(sel).getDate() + ' ' + MON[parse(sel).getMonth()] + '</p>' + (hj ? '<p class="hj">' + hj + '</p>' : '') + '</div>' +
      '<a class="step" href="' + (i < DAYS.length - 1 ? '#today/' + DAYS[i + 1].date : '#today/' + sel) + '" aria-label="اليوم التالي"' + (i === DAYS.length - 1 ? ' aria-disabled="true"' : '') + '>›</a></div>' +
      '<div class="hero-meta"><span>' + weekName(w) + (rel ? ' · ' + rel : '') + '</span>' +
      (st.t ? '<strong>' + st.n + ' من ' + st.t + '</strong>' : '') + '</div>' +
      (st.t ? '<div class="bar" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + pct + '%"></i></div>' : '') +
      '</section>';

    html += '<div class="wk" aria-label="أيام الأسبوع">' + week.map(function (x) {
      return '<a class="wk-d s-' + dayState(x) + (x.date === sel ? ' cur' : '') + '" href="#today/' + x.date + '">' +
        '<small>' + WD[parse(x.date).getDay()] + '</small><b>' + parse(x.date).getDate() + '</b></a>';

    html += '<section class="panel">';

      html += d.tasks.map(function (t) { return taskRow(t); }).join('');

      html += '<p class="empty">' + (d.note || 'لا مهام في هذا اليوم.') + '</p>';

    var od = overdue();
    if (od.length) {
      html += '<details class="panel late" open><summary>مهام فات موعدها <span>' + od.length + '</span></summary>' +
        od.map(function (x) { return taskRow(x.t, longDate(x.d.date)); }).join('') + '</details>';
    }

    html += '<p class="foot">يُحفظ إنجازك تلقائيًا في هذا المتصفح. لنقله إلى جهاز آخر استخدم النسخة الاحتياطية في صفحة الإحصاءات.</p>';
    $('#view').innerHTML = html;
  }

  /* ---------- صفحة الجدول ---------- */
  var filter = 'all';
  var firstScroll = true;

  function renderSchedule() {
    var td = today();
    var html = '<div class="chips" role="group" aria-label="تصفية حسب المقرر">' +
      '<button class="chip' + (filter === 'all' ? ' on' : '') + '" data-f="all">كل المقررات</button>' +
      MAIN.map(function (c) {
        return '<button class="chip' + (filter === c ? ' on' : '') + '" data-f="' + c + '" style="--c:' + COURSES[c].color + '">' + COURSES[c].short + '</button>';
      }).join('') + '</div>';

    var weeks = {};
    DAYS.forEach(function (d) { (weeks[weekIdx(d.date)] = weeks[weekIdx(d.date)] || []).push(d); });

    Object.keys(weeks).forEach(function (k) {
      var ds = weeks[k];
      var body = '';
      var wt = 0, wn = 0;
      ds.forEach(function (d) {
        var tasks = d.tasks.filter(function (t) { return filter === 'all' || t.c === filter; });
        if (!tasks.length && !(filter === 'all' && d.type === 'holiday')) return;
        tasks.forEach(function (t) { wt++; if (isDone(t.id)) wn++; });
        var state = dayState(d);
        body += '<section class="day s-' + state + '" id="d-' + d.date + '"' + (d.date === td ? ' data-today="1"' : '') + '>' +
          '<header><h3>' + longDate(d.date) + '</h3><a class="chip-s s-' + state + '" href="#today/' + d.date + '">' + STATE_TEXT[state] + '</a></header>' +
          (tasks.length ? tasks.map(function (t) { return taskRow(t); }).join('') : '<p class="empty">' + (d.note || '') + '</p>') +
          '</section>';
      });
      if (!body) return;
      html += '<div class="week"><h2>' + weekName(Number(k)) + ' <small>' + shortRange(ds[0].date, ds[ds.length - 1].date) + '</small>' +
        '<span class="wprog">' + wn + ' / ' + wt + '</span></h2>' + body + '</div>';
    });

    $('#view').innerHTML = html;
    if (firstScroll) {
      firstScroll = false;
      var t = $('[data-today]');
      if (t) t.scrollIntoView({ block: 'start' });
    }
  }

  /* ---------- صفحة الإحصاءات ---------- */
  function ring(pct) {
    var r = 52, c = 2 * Math.PI * r;
    return '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="نسبة الإنجاز ' + pct + '٪">' +
      '<circle cx="60" cy="60" r="' + r + '" class="ring-bg"/>' +
      '<circle cx="60" cy="60" r="' + r + '" class="ring-fg" stroke-dasharray="' + (c * pct / 100).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 60 60)"/>' +
      '<text x="60" y="68" text-anchor="middle" class="ring-t">' + pct + '%</text></svg>';
  }

  function renderStats() {
    var td = today(), all = allTasks();
    var total = all.length;
    var done = all.filter(function (x) { return isDone(x.t.id); }).length;
    var pct = total ? Math.round(done * 100 / total) : 0;
    var late = overdue().length;
    var lecAll = all.filter(function (x) { return x.t.k === 'lec'; });
    var lecDone = lecAll.filter(function (x) { return isDone(x.t.id); }).length;
    var fullDays = DAYS.filter(function (d) { return d.tasks.length && dayStat(d).n === d.tasks.length; }).length;
    var sched = DAYS.filter(function (d) { return d.tasks.length; }).length;
    var sk = streaks();

    var status;
    if (td < START) status = 'لم يبدأ الجدول بعد.';
    else if (late === 0) status = 'أنت في الموعد.';
    else status = 'فات موعد ' + late + ' من المهام.';

    var html = '<section class="panel sum"><div class="sum-ring">' + ring(pct) + '</div><div class="sum-tx">' +
      '<h1>إنجازك الكلي</h1><p>' + done + ' من ' + total + ' مهمة</p><p class="status ' + (late ? 'bad' : 'good') + '">' + status + '</p></div></section>';

    html += '<div class="kpis">' +
      kpi(lecDone + ' / ' + lecAll.length, 'محاضرة تمّت مشاهدتها') +
      kpi(fullDays + ' / ' + sched, 'يوم مكتمل') +
      kpi(sk.cur, 'أيام متتالية مكتملة') +
      kpi(sk.best, 'أطول سلسلة') + '</div>';

    html += '<section class="panel"><h2 class="ph">المقررات</h2>' + MAIN.map(function (c) {
      var ts = all.filter(function (x) { return x.t.c === c; });
      var dn = ts.filter(function (x) { return isDone(x.t.id); }).length;
      var ls = ts.filter(function (x) { return x.t.k === 'lec'; });
      var ld = ls.filter(function (x) { return isDone(x.t.id); }).length;
      var p = ts.length ? Math.round(dn * 100 / ts.length) : 0;
      return '<div class="crs" style="--c:' + COURSES[c].color + '"><div class="crs-h"><b>' + COURSES[c].name + '</b><span>' + p + '%</span></div>' +
        '<div class="bar"><i style="width:' + p + '%"></i></div>' +
        '<small>' + ld + ' من ' + ls.length + ' محاضرة · ' + dn + ' من ' + ts.length + ' مهمة</small></div>';
    }).join('') + '</section>';

    var weeks = {};
    all.forEach(function (x) {
      var k = weekIdx(x.d.date);
      weeks[k] = weeks[k] || { t: 0, n: 0, first: x.d.date, last: x.d.date };
      weeks[k].t++; if (isDone(x.t.id)) weeks[k].n++;
      if (x.d.date < weeks[k].first) weeks[k].first = x.d.date;
      if (x.d.date > weeks[k].last) weeks[k].last = x.d.date;
    });
    html += '<section class="panel"><h2 class="ph">الأسابيع</h2><div class="wbars">' +
      Object.keys(weeks).map(function (k) {
        var w = weeks[k], p = Math.round(w.n * 100 / w.t);
        return '<div class="wb' + (w.first > td ? ' fut' : '') + '"><div class="wb-col"><i style="height:' + Math.max(p, 2) + '%"></i></div>' +
          '<b>' + p + '%</b><small>' + (Number(k) < 6 ? 'أ' + (Number(k) + 1) : 'م' + (Number(k) - 5)) + '</small></div>';
      }).join('') + '</div><p class="legend-note">أ = أسبوع دراسة، م = أسبوع مراجعة.</p></section>';

    var wkRows = {};
    DAYS.forEach(function (d) { (wkRows[weekIdx(d.date)] = wkRows[weekIdx(d.date)] || []).push(d); });
    html += '<section class="panel"><h2 class="ph">خريطة الأيام</h2><div class="grid5 head">' +
      ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'].map(function (n) { return '<small>' + n + '</small>'; }).join('') + '</div>' +
      Object.keys(wkRows).map(function (k) {
        return '<div class="grid5">' + wkRows[k].map(function (d) {
          var s = dayState(d), t = dayStat(d);
          return '<a class="cell s-' + s + (d.date === td ? ' now' : '') + '" href="#today/' + d.date + '" title="' + longDate(d.date) + ' — ' + t.n + '/' + t.t + '"><span>' + parse(d.date).getDate() + '</span></a>';
        }).join('') + '</div>';
      }).join('') +
      '<ul class="legend"><li class="s-done">مكتمل</li><li class="s-partial-late">ناقص</li><li class="s-missed">متأخر</li><li class="s-today">اليوم</li><li class="s-future">قادم</li><li class="s-off">إجازة</li></ul></section>';

    html += '<details class="panel data"><summary>النسخة الاحتياطية</summary>' +
      '<p>الإنجاز محفوظ في متصفح هذا الجهاز فقط. صدّره إلى ملف لتنقله إلى الهاتف أو اللوح، أو لتحتفظ بنسخة إن مسحت بيانات المتصفح.</p>' +
      '<div class="btns"><button class="btn" data-act="export">تصدير الإنجاز</button>' +
      '<button class="btn" data-act="import">استيراد من ملف</button>' +
      '<button class="btn danger" data-act="reset">مسح كل الإنجاز</button></div>' +
      '<input type="file" id="file" accept="application/json,.json" hidden></details>';

    $('#view').innerHTML = html;
  }
  function kpi(v, l) { return '<div class="kpi"><b>' + v + '</b><span>' + l + '</span></div>'; }

  /* ---------- النسخ الاحتياطي ---------- */
  function doExport() {
    var blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'masar-backup-' + today() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast('تم تصدير النسخة الاحتياطية.');
  }
  function doImport(file) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var o = JSON.parse(r.result);
        if (!o || typeof o.done !== 'object') throw new Error('bad');
        var ids = {};
        allTasks().forEach(function (x) { ids[x.t.id] = 1; });
        var clean = {}, n = 0;
        Object.keys(o.done).forEach(function (k) { if (ids[k]) { clean[k] = o.done[k]; n++; } });
        if (!confirm('سيستبدل هذا إنجازك الحالي بـ ' + n + ' مهمة منجزة من الملف. هل تتابع؟')) return;
        S = { done: clean }; persist(); render();
        toast('تم استيراد الإنجاز.');
      } catch (e) { toast('الملف غير صالح. اختر ملفًا صدّرته من هذا الموقع.'); }
    };
    r.readAsText(file);
  }
  function doReset() {
    if (!confirm('سيُمسح كل إنجازك المحفوظ ولا يمكن التراجع. هل أنت متأكد؟')) return;
    S = { done: {} }; persist(); render();
    toast('تم مسح الإنجاز.');
  }

  /* ---------- التشغيل ---------- */
  var TITLES = { today: 'اليوم', schedule: 'الجدول', stats: 'الإحصاءات' };
  function render() {
    var page = route().page;
    document.body.setAttribute('data-page', page);
    document.title = TITLES[page] + ' — مسار المذاكرة';
    chrome(page);
    try {
      if (page === 'today') renderToday();
      else if (page === 'schedule') renderSchedule();
      else renderStats();
    } catch (err) {
      $('#view').innerHTML = '<div class="banner">حدث خطأ في عرض الصفحة: ' + err.message + '</div>';
    }
  }

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.matches && el.matches('input[data-id]')) {
      var id = el.getAttribute('data-id'), y = window.scrollY;
      toggle(id); render();
      if (isDone(id)) toast(PRAISE[Math.floor(Math.random() * PRAISE.length)]);
      window.scrollTo(0, y);
      var again = document.querySelector('input[data-id="' + id + '"]');
      if (again) again.focus({ preventScroll: true });
    } else if (el.id === 'file' && el.files[0]) {
      doImport(el.files[0]); el.value = '';
    }
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-f],[data-act]') : null;
    if (!b) return;
    if (b.hasAttribute('data-f')) {
      filter = b.getAttribute('data-f');
      var y = window.scrollY; renderSchedule(); window.scrollTo(0, y);
    } else {
      var a = b.getAttribute('data-act');
      if (a === 'quote') nextQuote();
      else if (a === 'export') doExport();
      else if (a === 'import') $('#file').click();
      else if (a === 'reset') doReset();
    }
  });
  window.addEventListener('hashchange', function () {
    var pg = route().page;
    if (pg === 'schedule') firstScroll = true;
    render();
    if (pg !== 'schedule') window.scrollTo(0, 0);
  });
  window.addEventListener('storage', function (e) { if (e.key === KEY) { S = load(); render(); } });

  render();
})();

</script>
</body>
</html>
