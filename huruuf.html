<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>لعبة الحروف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f172a;
    --panel:#16213e;
    --panel-2:#1c2b4a;
    --line:#2a3a5c;
    --text:#eef2ff;
    --muted:#93a3c2;
    --team-a:#2f7bff;
    --team-a-dark:#1a4fb0;
    --team-b:#ff4757;
    --team-b-dark:#b3222f;
    --neutral-cell:#233252;
    --gold:#ffcf4d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 50% -10%, #1c2c52, var(--bg) 60%);
    color:var(--text);
    font-family:'Cairo',sans-serif;
    min-height:100vh;
    padding:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  h1{
    margin:4px 0 0;
    font-size:clamp(22px,4vw,34px);
    font-weight:900;
    letter-spacing:1px;
  }
  .subtitle{color:var(--muted);font-size:14px;margin-top:-8px;}

  .topbar{
    width:100%;
    max-width:1000px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    align-items:center;
  }
  .control{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px 12px;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14px;
  }
  .control label{color:var(--muted);}
  select,button,input[type=text]{
    font-family:inherit;
    font-size:14px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    padding:6px 10px;
  }
  button{cursor:pointer;transition:transform .08s ease, filter .15s ease;}
  button:hover{filter:brightness(1.15);}
  button:active{transform:scale(.96);}
  .btn-main{background:var(--gold);color:#1a1a1a;font-weight:800;border:none;}
  .btn-ghost{background:transparent;}

  .scoreboard{
    width:100%;
    max-width:1000px;
    display:flex;
    gap:12px;
  }
  .score-card{
    flex:1;
    border-radius:14px;
    padding:10px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-weight:800;
    border:2px solid transparent;
  }
  .score-card.a{background:linear-gradient(135deg,var(--team-a-dark),var(--team-a));}
  .score-card.b{background:linear-gradient(135deg,var(--team-b-dark),var(--team-b));}
  .score-card input{
    background:rgba(0,0,0,.25);
    border:1px solid rgba(255,255,255,.3);
    color:#fff;
    max-width:130px;
    font-weight:800;
  }
  .score-card .points{font-size:22px;}

  .board-wrap{
    width:100%;
    max-width:640px;
    aspect-ratio:1/1;
    display:grid;
    gap:6px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:10px;
  }
  .cell{
    background:var(--neutral-cell);
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(18px,4.5vw,34px);
    font-weight:800;
    cursor:pointer;
    user-select:none;
    border:2px solid rgba(255,255,255,.04);
    transition:background .2s ease, transform .12s ease, border-color .2s ease;
  }
  .cell:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.25);}
  .cell.a{background:linear-gradient(160deg,var(--team-a),var(--team-a-dark));}
  .cell.b{background:linear-gradient(160deg,var(--team-b),var(--team-b-dark));}
  .cell.locked{cursor:not-allowed;}
  .cell.win-path{outline:3px solid var(--gold);outline-offset:-3px;}

  .edge-hint{
    width:100%;
    max-width:640px;
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--muted);
    padding:0 6px;
  }

  .buzzers{
    width:100%;
    max-width:1000px;
    display:flex;
    gap:14px;
    align-items:stretch;
  }
  .buzzer{
    flex:1;
    border:none;
    border-radius:16px;
    padding:22px 10px;
    font-size:clamp(16px,2.6vw,22px);
    font-weight:900;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    box-shadow:0 6px 0 rgba(0,0,0,.25);
  }
  .buzzer small{font-weight:600;opacity:.85;font-size:12px;}
  .buzzer.a{background:linear-gradient(160deg,var(--team-a),var(--team-a-dark));}
  .buzzer.b{background:linear-gradient(160deg,var(--team-b),var(--team-b-dark));}
  .buzzer:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}
  .buzzer:not(:disabled):active{transform:translateY(4px);box-shadow:none;}

  .status{
    width:100%;
    max-width:1000px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .status .msg{font-weight:800;font-size:16px;}
  .timer{
    font-size:26px;
    font-weight:900;
    min-width:64px;
    text-align:center;
    color:var(--gold);
  }
  .status .actions{display:flex;gap:8px;}

  .overlay{
    position:fixed;inset:0;
    background:rgba(5,8,20,.82);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:16px;
  }
  .overlay.show{display:flex;}
  .win-card{
    background:var(--panel);
    border:2px solid var(--gold);
    border-radius:20px;
    padding:34px 40px;
    text-align:center;
    max-width:420px;
  }
  .win-card h2{font-size:30px;margin:0 0 8px;}
  .win-card p{color:var(--muted);margin:0 0 18px;}

  @media (max-width:480px){
    .buzzers{flex-direction:row;}
    .status{flex-direction:column;align-items:stretch;text-align:center;}
  }
</style>
</head>
<body>

<h1>🔤 لعبة الحروف</h1>
<div class="subtitle">اربط خلاياك بلونك من طرف إلى الطرف الآخر لتفوز</div>

<div class="topbar">
  <div class="control">
    <label for="gridSize">حجم اللوح</label>
    <select id="gridSize">
      <option value="5">5×5</option>
      <option value="6">6×6</option>
      <option value="7">7×7</option>
    </select>
  </div>
  <div class="control">
    <label for="answerTime">مدة الإجابة</label>
    <select id="answerTime">
      <option value="10">10 ثواني</option>
      <option value="15" selected>15 ثانية</option>
      <option value="20">20 ثانية</option>
      <option value="30">30 ثانية</option>
    </select>
  </div>
  <button class="btn-main" id="newGameBtn">🔄 لعبة جديدة</button>
</div>

<div class="scoreboard">
  <div class="score-card a">
    <input type="text" id="nameA" value="الفريق الأزرق" maxlength="18">
    <span class="points" id="scoreA">0</span>
  </div>
  <div class="score-card b">
    <input type="text" id="nameB" value="الفريق الأحمر" maxlength="18">
    <span class="points" id="scoreB">0</span>
  </div>
</div>

<div class="edge-hint">
  <span id="hintA">↔️ الأزرق يفوز بخط من اليمين لليسار</span>
  <span id="hintB">↕️ الأحمر يفوز بخط من الأعلى للأسفل</span>
</div>

<div class="board-wrap" id="board"></div>

<div class="status">
  <div class="msg" id="statusMsg">اضغط جرس الفريق بعد الإجابة الصحيحة، ثم اختر الحرف من اللوح</div>
  <div class="timer" id="timer">--</div>
  <div class="actions">
    <button class="btn-ghost" id="resetBuzzerBtn">إعادة الجرس</button>
  </div>
</div>

<div class="buzzers">
  <button class="buzzer a" id="buzzA">
    🔵 <span id="buzzLabelA">جرس الفريق الأزرق</span>
    <small>مفتاح الاختصار: Z</small>
  </button>
  <button class="buzzer b" id="buzzB">
    🔴 <span id="buzzLabelB">جرس الفريق الأحمر</span>
    <small>مفتاح الاختصار: M</small>
  </button>
</div>

<div class="overlay" id="overlay">
  <div class="win-card">
    <h2 id="winTitle">🎉 الفريق الأزرق فاز!</h2>
    <p>تكوّن خط متصل من طرف اللوح إلى الطرف الآخر</p>
    <button class="btn-main" id="playAgainBtn">لعبة جديدة</button>
  </div>
</div>

<script>
const ARABIC_LETTERS = ["ا","ب","ت","ث","ج","ح","خ","د","ذ","ر","ز","س","ش","ص","ض","ط","ظ","ع","غ","ف","ق","ك","ل","م","ن","ه","و","ي"];

const boardEl = document.getElementById('board');
const gridSizeSel = document.getElementById('gridSize');
const answerTimeSel = document.getElementById('answerTime');
const statusMsg = document.getElementById('statusMsg');
const timerEl = document.getElementById('timer');
const buzzA = document.getElementById('buzzA');
const buzzB = document.getElementById('buzzB');
const scoreAEl = document.getElementById('scoreA');
const scoreBEl = document.getElementById('scoreB');
const nameAEl = document.getElementById('nameA');
const nameBEl = document.getElementById('nameB');
const overlay = document.getElementById('overlay');
const winTitle = document.getElementById('winTitle');

let size = 5;
let cellsData = [];     // {letter, owner: null|'a'|'b'}
let cellEls = [];
let scores = {a:0, b:0};
let gameOver = false;
let buzzedTeam = null;  // 'a' | 'b' | null
let timerInterval = null;
let timeLeft = 0;

function pickLetters(n){
  const pool = [];
  while(pool.length < n){
    pool.push(...ARABIC_LETTERS);
  }
  // shuffle full pool then take n, allowing repeats only when n > alphabet size
  for(let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]] = [pool[j],pool[i]];
  }
  return pool.slice(0, n);
}

function buildBoard(){
  size = parseInt(gridSizeSel.value, 10);
  boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
  boardEl.style.gridTemplateRows = `repeat(${size}, 1fr)`;
  boardEl.innerHTML = '';
  cellEls = [];

  const letters = pickLetters(size*size);
  cellsData = letters.map(l => ({letter:l, owner:null}));

  cellsData.forEach((cellData, idx) => {
    const div = document.createElement('div');
    div.className = 'cell';
    div.textContent = cellData.letter;
    div.dataset.idx = idx;
    div.addEventListener('click', () => onCellClick(idx));
    boardEl.appendChild(div);
    cellEls.push(div);
  });

  gameOver = false;
  overlay.classList.remove('show');
}

function idxToRC(idx){ return [Math.floor(idx/size), idx % size]; }
function rcToIdx(r,c){ return r*size + c; }

function onCellClick(idx){
  if(gameOver) return;
  if(!buzzedTeam){
    statusMsg.textContent = 'لازم فريق يضغط الجرس أولًا قبل اختيار الحرف';
    return;
  }
  if(cellsData[idx].owner){
    statusMsg.textContent = 'هذا الحرف تم اختياره من قبل، اختر حرفًا آخر';
    return;
  }
  assignCell(idx, buzzedTeam);
}

function assignCell(idx, team){
  cellsData[idx].owner = team;
  cellEls[idx].classList.add(team);
  scores[team]++;
  updateScores();
  stopBuzzTimer();
  const winPath = checkWin(team);
  if(winPath){
    endGame(team, winPath);
  } else {
    resetBuzzerState(`تم! اختر الحرف التالي واضغط الجرس مجددًا.`);
  }
}

function updateScores(){
  scoreAEl.textContent = scores.a;
  scoreBEl.textContent = scores.b;
}

// team 'a' connects right edge (col size-1) to left edge (col 0)
// team 'b' connects top edge (row 0) to bottom edge (row size-1)
function checkWin(team){
  const visited = new Array(size*size).fill(false);
  const stack = [];
  const parent = new Array(size*size).fill(-1);

  if(team === 'a'){
    for(let r=0;r<size;r++){
      const idx = rcToIdx(r,0);
      if(cellsData[idx].owner === 'a'){ stack.push(idx); visited[idx]=true; }
    }
  } else {
    for(let c=0;c<size;c++){
      const idx = rcToIdx(0,c);
      if(cellsData[idx].owner === 'b'){ stack.push(idx); visited[idx]=true; }
    }
  }

  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  while(stack.length){
    const cur = stack.pop();
    const [r,c] = idxToRC(cur);

    if(team === 'a' && c === size-1){
      return buildPath(parent, cur);
    }
    if(team === 'b' && r === size-1){
      return buildPath(parent, cur);
    }

    for(const [dr,dc] of dirs){
      const nr = r+dr, nc = c+dc;
      if(nr<0||nr>=size||nc<0||nc>=size) continue;
      const nIdx = rcToIdx(nr,nc);
      if(visited[nIdx]) continue;
      if(cellsData[nIdx].owner !== team) continue;
      visited[nIdx] = true;
      parent[nIdx] = cur;
      stack.push(nIdx);
    }
  }
  return null;
}

function buildPath(parent, endIdx){
  const path = [];
  let cur = endIdx;
  while(cur !== -1){
    path.push(cur);
    cur = parent[cur];
  }
  return path;
}

function endGame(team, path){
  gameOver = true;
  path.forEach(i => cellEls[i].classList.add('win-path'));
  const teamName = team === 'a' ? nameAEl.value : nameBEl.value;
  winTitle.textContent = `🎉 ${teamName} فاز!`;
  overlay.classList.add('show');
  statusMsg.textContent = `${teamName} فاز باللعبة!`;
  buzzA.disabled = true;
  buzzB.disabled = true;
  timerEl.textContent = '--';
}

function onBuzz(team){
  if(gameOver || buzzedTeam) return;
  buzzedTeam = team;
  buzzA.disabled = true;
  buzzB.disabled = true;
  const teamName = team === 'a' ? nameAEl.value : nameBEl.value;
  statusMsg.textContent = `${teamName} ضغط الجرس! اختر الحرف الصحيح من اللوح خلال المدة المحددة`;
  startBuzzTimer();
}

function startBuzzTimer(){
  timeLeft = parseInt(answerTimeSel.value, 10);
  timerEl.textContent = timeLeft;
  stopBuzzTimer(true);
  timerInterval = setInterval(() => {
    timeLeft--;
    timerEl.textContent = timeLeft;
    if(timeLeft <= 0){
      stopBuzzTimer();
      resetBuzzerState('انتهى الوقت! الجرس مفتوح للفريقين من جديد.');
    }
  }, 1000);
}

function stopBuzzTimer(skipReset){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  if(!skipReset) timerEl.textContent = '--';
}

function resetBuzzerState(message){
  buzzedTeam = null;
  if(!gameOver){
    buzzA.disabled = false;
    buzzB.disabled = false;
  }
  if(message) statusMsg.textContent = message;
  timerEl.textContent = '--';
}

buzzA.addEventListener('click', () => onBuzz('a'));
buzzB.addEventListener('click', () => onBuzz('b'));
document.getElementById('resetBuzzerBtn').addEventListener('click', () => {
  stopBuzzTimer();
  resetBuzzerState('تمت إعادة الجرس يدويًا.');
});

document.addEventListener('keydown', (e) => {
  const tag = document.activeElement.tagName;
  if(tag === 'INPUT' || tag === 'SELECT') return;
  if(e.key.toLowerCase() === 'z') onBuzz('a');
  if(e.key.toLowerCase() === 'm') onBuzz('b');
});

document.getElementById('newGameBtn').addEventListener('click', () => {
  scores = {a:0,b:0};
  updateScores();
  stopBuzzTimer();
  resetBuzzerState('لعبة جديدة! اضغط الجرس بعد كل إجابة صحيحة.');
  buzzA.disabled = false;
  buzzB.disabled = false;
  buildBoard();
});
document.getElementById('playAgainBtn').addEventListener('click', () => {
  document.getElementById('newGameBtn').click();
});
gridSizeSel.addEventListener('change', () => document.getElementById('newGameBtn').click());

buildBoard();
</script>
</body>
</html>
