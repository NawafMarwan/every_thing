<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بادر تايم | Badir Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --midnight:#0a1a2e;
    --midnight-deep:#061120;
    --ice-blue:#1f9bd6;
    --ice-blue-dark:#0e6a99;
    --ice-blue-soft:#6fd4f5;
    --frost-white:#eaf6ff;
    --text-dark:#0f3049;
    --text-dim:rgba(15,48,73,0.62);
    --card-glass:rgba(31,155,214,0.06);
    --card-border:rgba(31,155,214,0.22);
    --lime:#7cc63e;
    --lime-dark:#4e8a22;
    --juice-accent:#7cc63e;
    --cream-accent:#1f9bd6;
    --price-gold:#e07a1f;
    --price-bg:rgba(124,198,62,0.16);
    --price-border:rgba(124,198,62,0.45);
  }
 
  *{margin:0;padding:0;box-sizing:border-box;}
 
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% 0%, rgba(31,155,214,0.14), transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 15%, rgba(124,198,62,0.10), transparent 55%),
      linear-gradient(180deg, #f4fbff 0%, #e6f4fb 45%, #eef8f2 100%);
    color:var(--text-dark);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
 
  /* ambient snow */
  .snowfield{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .flake{
    position:absolute;top:-5%;
    color:rgba(31,155,214,0.28);
    font-size:14px;
    animation:fall linear infinite;
    user-select:none;
  }
  @keyframes fall{
    to{transform:translateY(110vh) translateX(20px);}
  }
 
  header{
    position:relative;z-index:2;
    display:flex;flex-direction:column;align-items:center;
    padding:0 20px 26px;
    text-align:center;
  }
  .hero-band{
    position:relative;
    width:100%;
    padding:46px 20px 34px;
    margin-bottom:6px;
    overflow:hidden;
    background:linear-gradient(115deg, rgba(31,155,214,0.10) 0%, rgba(124,198,62,0.08) 100%);
  }
  .hero-band::before{
    content:"";
    position:absolute;inset:-20% -10%;
    background:linear-gradient(100deg, transparent 42%, rgba(255,255,255,0.55) 50%, transparent 58%);
    transform:rotate(-3deg);
  }
  .hero-band::after{
    content:"";
    position:absolute;left:0;right:0;bottom:0;height:2px;
    background:linear-gradient(90deg, transparent, var(--ice-blue), var(--lime), transparent);
  }
  .brand-mark{
    position:relative;z-index:1;
    display:flex;flex-direction:column;align-items:center;gap:0;
  }
  .brand-icons{
    font-size:15px;letter-spacing:6px;
    margin-bottom:14px;
    color:var(--text-dim);
  }
  .brand-icons span{margin:0 6px;}
  .brand-name-ar{
    font-family:'Reem Kufi', sans-serif;
    font-weight:700;
    font-size:clamp(38px, 9vw, 58px);
    letter-spacing:4px;
    color:var(--ice-blue-dark);
    line-height:1.15;
  }
  .brand-underline{
    width:64px;height:5px;border-radius:4px;
    margin:12px auto 10px;
    background:linear-gradient(90deg, var(--lime), var(--ice-blue));
  }
  .brand-name-en{
    font-family:'Cairo',sans-serif;
    font-weight:600;
    font-size:14px;
    color:var(--lime-dark);
    letter-spacing:5px;
    text-transform:uppercase;
  }
 
  .tagline{
    margin-top:16px;
    font-family:'Cairo',sans-serif;
    font-weight:600;
    font-size:14px;
    color:var(--text-dim);
    letter-spacing:0.5px;
  }
 
  nav.tabs{
    position:sticky;top:0;z-index:20;
    display:flex;justify-content:center;
    padding:0;
    backdrop-filter:blur(14px);
    background:rgba(244,251,255,0.9);
    border-bottom:1px solid rgba(31,155,214,0.15);
  }
  .tab-btn{
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--text-dim);
    background:transparent;
    border:none;
    border-bottom:3px solid transparent;
    padding:16px 30px;
    cursor:pointer;
    transition:all .25s ease;
    display:flex;align-items:center;gap:8px;
  }
  .tab-btn .emoji{font-size:17px;}
  .tab-btn.active{
    color:var(--ice-blue-dark);
    border-bottom-color:var(--lime);
  }
 
  main{
    position:relative;z-index:2;
    max-width:980px;
    margin:0 auto;
    padding:28px 18px 150px;
  }
 
  .section-title{
    font-family:'Reem Kufi', sans-serif;
    font-weight:600;
    font-size:24px;
    letter-spacing:1px;
    margin:6px 4px 18px;
    display:flex;align-items:center;gap:10px;
    color:var(--text-dark);
  }
  .section-title .bar{
    width:5px;height:22px;border-radius:4px;
    background:linear-gradient(180deg, var(--ice-blue), var(--lime));
  }
 
  .grid{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:36px;
  }
 
  .card{
    background:rgba(255,255,255,0.72);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:14px 16px;
    display:flex;align-items:center;gap:14px;
    position:relative;
    backdrop-filter:blur(6px);
    box-shadow:0 3px 14px rgba(31,155,214,0.07);
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .card:hover{
    transform:translateX(-2px);
    border-color:rgba(31,155,214,0.4);
    box-shadow:0 8px 22px rgba(31,155,214,0.15);
  }
  .card .icon-badge{
    flex:0 0 auto;
    width:52px;height:52px;
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;
    background:linear-gradient(150deg, rgba(31,155,214,0.14), rgba(124,198,62,0.12));
    border:1px solid rgba(31,155,214,0.18);
  }
  .card .info{
    flex:1 1 auto;
    min-width:0;
    display:flex;flex-direction:column;gap:2px;
  }
  .card h3{
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:16px;
    color:var(--text-dark);
  }
  .card p.desc{
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.5;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .card .price{
    font-family:'Cairo',sans-serif;
    font-weight:800;
    font-size:14px;
    color:var(--lime-dark);
    background:var(--price-bg);
    border:1px solid var(--price-border);
    padding:3px 10px;
    border-radius:999px;
    white-space:nowrap;
    align-self:flex-start;
    margin-top:4px;
  }
 
  .qty-row{
    flex:0 0 auto;
    display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .stepper{
    display:flex;align-items:center;gap:0;
    background:rgba(31,155,214,0.06);
    border:1px solid rgba(31,155,214,0.22);
    border-radius:999px;
    overflow:hidden;
  }
  .stepper button{
    width:30px;height:30px;
    border:none;background:transparent;
    color:var(--ice-blue-dark);
    font-size:17px;font-weight:700;
    cursor:pointer;
    transition:background .15s;
  }
  .stepper button:hover{background:rgba(31,155,214,0.15);}
  .stepper .count{
    width:26px;text-align:center;
    color:var(--text-dark);
    font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;
  }
  .add-btn{
    font-family:'Cairo',sans-serif;font-weight:700;font-size:11.5px;
    color:#fff;
    background:linear-gradient(135deg, var(--ice-blue), var(--ice-blue-dark));
    border:none;border-radius:999px;
    padding:6px 14px;
    cursor:pointer;
    transition:filter .2s;
    white-space:nowrap;
  }
  .add-btn:hover{filter:brightness(1.08);}
  .add-btn.in-cart{
    background:linear-gradient(135deg, var(--lime-dark), var(--lime));
  }
 
  /* cart bar */
  .cart-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:30;
    display:flex;justify-content:center;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, transparent, rgba(238,248,242,0.96) 25%);
    pointer-events:none;
  }
  .cart-inner{
    pointer-events:auto;
    width:100%;max-width:640px;
    background:rgba(255,255,255,0.94);
    border:1px solid rgba(31,155,214,0.28);
    border-radius:18px;
    box-shadow:0 10px 34px rgba(15,48,73,0.18), 0 0 26px rgba(31,155,214,0.12);
    padding:14px 18px;
    display:flex;align-items:center;justify-content:space-between;
    gap:14px;
    backdrop-filter:blur(10px);
    transition:transform .3s ease, opacity .3s ease;
  }
  .cart-inner.hidden{transform:translateY(140%);opacity:0;pointer-events:none;}
  .cart-info{display:flex;flex-direction:column;gap:2px;}
  .cart-info .label{font-size:12px;color:var(--text-dim);}
  .cart-info .total{
    font-family:'Cairo',sans-serif;font-weight:800;font-size:20px;color:var(--text-dark);
  }
  .cart-info .total span{color:var(--lime-dark);}
  .checkout-btn{
    font-family:'Cairo',sans-serif;font-weight:800;font-size:15px;
    color:#fff;
    background:linear-gradient(135deg, var(--ice-blue), var(--ice-blue-dark));
    border:none;border-radius:14px;
    padding:13px 26px;
    cursor:pointer;
    box-shadow:0 4px 16px rgba(31,155,214,0.35);
    transition:transform .15s ease;
    white-space:nowrap;
  }
  .checkout-btn:active{transform:scale(0.96);}
 
  /* confirmation overlay */
  .overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(15,48,73,0.55);
    backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;
    transition:opacity .3s ease;
    padding:20px;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .confirm-card{
    width:min(380px, 92vw);
    background:linear-gradient(160deg, rgba(255,255,255,0.98), rgba(238,248,242,0.98));
    border:1px solid rgba(31,155,214,0.3);
    border-radius:24px;
    padding:36px 26px 30px;
    text-align:center;
    box-shadow:0 20px 60px rgba(15,48,73,0.35), 0 0 40px rgba(31,155,214,0.15);
    transform:scale(0.9);
    transition:transform .3s ease;
  }
  .overlay.show .confirm-card{transform:scale(1);}
  .confirm-icon{
    width:76px;height:76px;margin:0 auto 18px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(31,155,214,0.18), transparent 70%);
    display:flex;align-items:center;justify-content:center;
    font-size:38px;
    border:1px solid rgba(31,155,214,0.3);
  }
  .confirm-card h2{
    font-family:'Cairo',sans-serif;font-weight:800;font-size:21px;color:var(--text-dark);margin-bottom:8px;
  }
  .confirm-card p{
    font-size:14px;color:var(--text-dim);line-height:1.7;margin-bottom:22px;
  }
  .confirm-card .order-total{
    font-family:'Cairo',sans-serif;font-weight:700;font-size:15px;
    color:var(--lime-dark);margin-bottom:22px;
  }
  .close-confirm{
    font-family:'Cairo',sans-serif;font-weight:700;font-size:14px;
    color:#fff;
    background:linear-gradient(135deg, var(--ice-blue), var(--ice-blue-dark));
    border:none;border-radius:12px;
    padding:11px 24px;
    cursor:pointer;
    width:100%;
  }
 
  .empty-note{
    text-align:center;font-size:13px;color:rgba(234,246,255,0.45);
    padding:14px 0 6px;
  }
 
  /* invoice button + panel */
  .waiter-btn{
    position:fixed;top:16px;left:16px;z-index:25;
    display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,0.88);
    border:1px solid rgba(31,155,214,0.3);
    border-radius:999px;
    padding:9px 16px;
    font-family:'Cairo',sans-serif;font-weight:700;font-size:13px;
    color:var(--text-dark);
    cursor:pointer;
    backdrop-filter:blur(8px);
    box-shadow:0 4px 16px rgba(15,48,73,0.15);
  }
  .waiter-btn .badge{
    background:linear-gradient(135deg, var(--ice-blue), var(--ice-blue-dark));
    color:#fff;
    font-size:11px;font-weight:800;
    min-width:20px;height:20px;
    border-radius:999px;
    display:flex;align-items:center;justify-content:center;
    padding:0 5px;
  }
 
  .waiter-overlay{
    position:fixed;inset:0;z-index:50;
    background:rgba(15,48,73,0.55);
    backdrop-filter:blur(6px);
    display:flex;align-items:flex-start;justify-content:center;
    opacity:0;pointer-events:none;
    transition:opacity .3s ease;
    padding:60px 16px 20px;
    overflow-y:auto;
  }
  .waiter-overlay.show{opacity:1;pointer-events:auto;}
  .waiter-panel{
    width:min(520px, 94vw);
    background:linear-gradient(160deg, rgba(255,255,255,0.98), rgba(238,248,242,0.98));
    border:1px solid rgba(31,155,214,0.3);
    border-radius:22px;
    padding:24px 20px 26px;
    box-shadow:0 20px 60px rgba(15,48,73,0.3), 0 0 40px rgba(31,155,214,0.12);
  }
  .waiter-panel-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:16px;
  }
  .waiter-panel-head h2{
    font-family:'Cairo',sans-serif;font-weight:800;font-size:19px;color:var(--text-dark);
    display:flex;align-items:center;gap:8px;
  }
  .waiter-close{
    background:rgba(31,155,214,0.08);
    border:1px solid rgba(31,155,214,0.22);
    color:var(--text-dark);
    width:32px;height:32px;border-radius:50%;
    cursor:pointer;font-size:16px;
  }
  .orders-list{display:flex;flex-direction:column;gap:12px;max-height:65vh;overflow-y:auto;}
  .order-item{
    background:rgba(31,155,214,0.05);
    border:1px solid rgba(31,155,214,0.16);
    border-radius:14px;
    padding:14px 16px;
  }
  .order-item .order-top{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:8px;
  }
  .order-item .order-num{
    font-family:'Cairo',sans-serif;font-weight:800;font-size:14px;color:var(--ice-blue-dark);
  }
  .order-item .order-time{
    font-size:11px;color:var(--text-dim);
  }
  .order-item ul{list-style:none;display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
  .order-item li{
    font-size:13px;color:var(--text-dark);
    display:flex;justify-content:space-between;
  }
  .order-item li span.qty{color:var(--lime-dark);font-weight:700;}
  .order-item .order-bottom{
    display:flex;align-items:center;justify-content:space-between;
    border-top:1px dashed rgba(31,155,214,0.18);
    padding-top:8px;
  }
  .order-item .order-total-tag{
    font-family:'Cairo',sans-serif;font-weight:700;font-size:13px;color:var(--lime-dark);
  }
  .status-tag{
    font-family:'Cairo',sans-serif;font-weight:700;font-size:11px;
    padding:4px 10px;border-radius:999px;
    background:rgba(124,198,62,0.15);
    color:var(--lime-dark);
    border:1px solid rgba(124,198,62,0.35);
    cursor:pointer;
  }
  .status-tag.done{
    background:rgba(15,48,73,0.05);
    color:var(--text-dim);
    border-color:rgba(15,48,73,0.12);
    text-decoration:line-through;
  }
  .no-orders{
    text-align:center;padding:40px 10px;
    color:var(--text-dim);font-size:14px;
  }
 
  @media (max-width:420px){
    .card{padding:12px 12px;gap:10px;}
    .card .icon-badge{width:44px;height:44px;font-size:22px;}
    .card h3{font-size:15px;}
    .add-btn{padding:6px 10px;font-size:11px;}
  }
</style>
</head>
<body>
 
<div class="snowfield" id="snowfield"></div>
 
<button class="waiter-btn" onclick="openWaiterPanel()">
  🧾 الفاتورة <span class="badge" id="waiterBadge">0</span>
</button>
 
<div class="waiter-overlay" id="waiterOverlay">
  <div class="waiter-panel">
    <div class="waiter-panel-head">
      <h2>🧾 الفاتورة</h2>
      <button class="waiter-close" onclick="closeWaiterPanel()">✕</button>
    </div>
    <div class="orders-list" id="ordersList">
      <div class="no-orders">لا توجد طلبات حتى الآن</div>
    </div>
  </div>
</div>
 
<header>
  <div class="hero-band">
    <div class="brand-mark">
      <div class="brand-icons"><span>🧊</span>·<span>🌿</span>·<span>🍋</span></div>
      <div class="brand-name-ar">بادر تايم</div>
      <div class="brand-underline"></div>
      <div class="brand-name-en">Badir Time</div>
    </div>
  </div>
  <div class="tagline">طازج .. من أجلك 🍦 مكونات طبيعية وجودة عالية 🥤</div>
</header>
 
<nav class="tabs">
  <button class="tab-btn active" data-target="icecream" onclick="switchTab('icecream', this)">
    <span class="emoji">🍨</span> مثلجات
  </button>
  <button class="tab-btn" data-target="juices" onclick="switchTab('juices', this)">
    <span class="emoji">🥤</span> عصائر
  </button>
</nav>
 
<main>
 
  <section id="icecream">
    <div class="section-title"><span class="bar"></span> مثلجات</div>
    <div class="grid" id="icecream-grid"></div>
  </section>
 
  <section id="juices" style="display:none;">
    <div class="section-title"><span class="bar"></span> عصائر</div>
    <div class="grid" id="juices-grid"></div>
  </section>
 
</main>
 
<div class="cart-bar">
  <div class="cart-inner hidden" id="cartInner">
    <div class="cart-info">
      <span class="label" id="cartLabel">لا يوجد منتجات مختارة</span>
      <span class="total">الإجمالي: <span id="cartTotal">0</span> ريال</span>
    </div>
    <button class="checkout-btn" onclick="submitOrder()">تسليم الطلب ✅</button>
  </div>
</div>
 
<div class="overlay" id="overlay">
  <div class="confirm-card">
    <div class="confirm-icon">🚴‍♂️❄️</div>
    <h2>تم استلام طلبك!</h2>
    <p>طلبك الآن قيد التجهيز وهو في طريقه إليك بأسرع وقت ممكن. نتمنى لك تجربة منعشة مع بادر تايم 🧊</p>
    <div class="order-total">إجمالي الطلب: <span id="finalTotal">0</span> ريال</div>
    <button class="close-confirm" onclick="closeOverlay()">تم، شكراً</button>
  </div>
</div>
 
<script>
  const products = {
    icecream: [
      {id:'ic1', name:'آيسكريم قهوة سعودية', desc:'الوصفة المميزة للمحل، نكهة كريمية غنية وقوام ناعم فاخر.', price:18, icon:'🍦'},
      {id:'ic2', name:'آيسكريم مانجو', desc:'مانجو طازجة بقوام كريمي ونكهة استوائية منعشة.', price:14, icon:'🥭'},
      {id:'ic3', name:'آيسكريم توت بري', desc:'طعم البطيخ الصيفي الحقيقي في كل ملعقة.', price:13, icon:'🍉'},
      {id:'ic4', name:'آيسكريم كوكيز اوريو', desc:'مزيج من الفواكه الاستوائية بنكهة غنية ومختلفة.', price:16, icon:'🍍'},
    ],
    juices: [
      {id:'j1', name:'جي', desc:'عصير طازج بلمسة كلاسيكية يناسب كل الأوقات.', price:10, icon:'🥤'},
      {id:'j2', name:'كركديه', desc:'مزيج فواكه متعددة بطعم متوازن ومنعش.', price:12, icon:'🍹'},
      {id:'j3', name:'بادر جوسي', desc:'عصيرنا المميز بوصفة بادر الخاصة، كثيف ولذيذ.', price:15, icon:'🧃'},
      {id:'j4', name:'آيس تي', desc:'شاي مثلج بارد ومنعش، مثالي في الأجواء الحارة.', price:8, icon:'🧊'},
    ]
  };
 
  const cart = {}; // id -> {name, price, qty}
  const orders = []; // submitted orders history for the waiter
  let orderCounter = 0;
 
  function renderProducts(){
    const icGrid = document.getElementById('icecream-grid');
    const juGrid = document.getElementById('juices-grid');
    icGrid.innerHTML = products.icecream.map(cardHTML).join('');
    juGrid.innerHTML = products.juices.map(cardHTML).join('');
  }
 
  function cardHTML(p){
    return `
      <div class="card" id="card-${p.id}">
        <div class="icon-badge">${p.icon}</div>
        <div class="info">
          <h3>${p.name}</h3>
          <p class="desc">${p.desc}</p>
          <span class="price">${p.price} ﷼</span>
        </div>
        <div class="qty-row">
          <div class="stepper">
            <button onclick="changeQty('${p.id}', -1)">−</button>
            <span class="count" id="count-${p.id}">0</span>
            <button onclick="changeQty('${p.id}', 1)">+</button>
          </div>
          <button class="add-btn" id="addbtn-${p.id}" onclick="changeQty('${p.id}', 1)">إضافة</button>
        </div>
      </div>`;
  }
 
  function findProduct(id){
    return products.icecream.find(p=>p.id===id) || products.juices.find(p=>p.id===id);
  }
 
  function changeQty(id, delta){
    const p = findProduct(id);
    if(!cart[id]) cart[id] = {name:p.name, price:p.price, qty:0};
    cart[id].qty = Math.max(0, cart[id].qty + delta);
    if(cart[id].qty === 0) delete cart[id];
 
    const countEl = document.getElementById('count-'+id);
    const btnEl = document.getElementById('addbtn-'+id);
    const qty = cart[id] ? cart[id].qty : 0;
    countEl.textContent = qty;
    btnEl.textContent = qty > 0 ? 'في السلة ✓' : 'إضافة';
    btnEl.classList.toggle('in-cart', qty > 0);
 
    updateCartBar();
  }
 
  function updateCartBar(){
    const ids = Object.keys(cart);
    const cartInner = document.getElementById('cartInner');
    const label = document.getElementById('cartLabel');
    const totalEl = document.getElementById('cartTotal');
 
    if(ids.length === 0){
      cartInner.classList.add('hidden');
      return;
    }
    cartInner.classList.remove('hidden');
 
    let totalQty = 0, totalPrice = 0;
    ids.forEach(id=>{
      totalQty += cart[id].qty;
      totalPrice += cart[id].qty * cart[id].price;
    });
 
    label.textContent = `${totalQty} منتج مختار`;
    totalEl.textContent = totalPrice;
  }
 
  function submitOrder(){
    const ids = Object.keys(cart);
    if(ids.length === 0) return;
    let totalPrice = 0;
    const items = ids.map(id=>{
      totalPrice += cart[id].qty * cart[id].price;
      return {name: cart[id].name, qty: cart[id].qty, price: cart[id].price};
    });
 
    orderCounter += 1;
    const now = new Date();
    const timeStr = now.toLocaleTimeString('ar-SA', {hour:'2-digit', minute:'2-digit'});
    orders.unshift({
      num: orderCounter,
      time: timeStr,
      items: items,
      total: totalPrice,
      done: false
    });
    renderWaiterPanel();
 
    document.getElementById('finalTotal').textContent = totalPrice;
    document.getElementById('overlay').classList.add('show');
  }
 
  function renderWaiterPanel(){
    const list = document.getElementById('ordersList');
    const badge = document.getElementById('waiterBadge');
    const pendingCount = orders.filter(o=>!o.done).length;
    badge.textContent = pendingCount;
 
    if(orders.length === 0){
      list.innerHTML = '<div class="no-orders">لا توجد طلبات حتى الآن</div>';
      return;
    }
 
    list.innerHTML = orders.map(o=>`
      <div class="order-item">
        <div class="order-top">
          <span class="order-num">طلب رقم #${o.num}</span>
          <span class="order-time">${o.time}</span>
        </div>
        <ul>
          ${o.items.map(it=>`<li><span>${it.name}</span><span class="qty">× ${it.qty}</span></li>`).join('')}
        </ul>
        <div class="order-bottom">
          <span class="order-total-tag">الإجمالي: ${o.total} ريال</span>
          <span class="status-tag ${o.done ? 'done':''}" onclick="toggleOrderStatus(${o.num})">
            ${o.done ? 'تم التجهيز ✓' : 'قيد التجهيز'}
          </span>
        </div>
      </div>
    `).join('');
  }
 
  function toggleOrderStatus(num){
    const order = orders.find(o=>o.num === num);
    if(order){
      order.done = !order.done;
      renderWaiterPanel();
    }
  }
 
  function openWaiterPanel(){
    document.getElementById('waiterOverlay').classList.add('show');
  }
  function closeWaiterPanel(){
    document.getElementById('waiterOverlay').classList.remove('show');
  }
 
  function closeOverlay(){
    document.getElementById('overlay').classList.remove('show');
    // reset cart after confirmation
    Object.keys(cart).forEach(id=>{
      delete cart[id];
      const countEl = document.getElementById('count-'+id);
      const btnEl = document.getElementById('addbtn-'+id);
      if(countEl) countEl.textContent = 0;
      if(btnEl){ btnEl.textContent = 'إضافة'; btnEl.classList.remove('in-cart'); }
    });
    updateCartBar();
  }
 
  function switchTab(target, btn){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('icecream').style.display = target === 'icecream' ? 'block' : 'none';
    document.getElementById('juices').style.display = target === 'juices' ? 'block' : 'none';
  }
 
  function initSnow(){
    const field = document.getElementById('snowfield');
    const flakes = ['❄','🌿','✦'];
    for(let i=0;i<26;i++){
      const el = document.createElement('span');
      el.className = 'flake';
      el.textContent = flakes[i % flakes.length];
      el.style.left = Math.random()*100 + '%';
      el.style.fontSize = (10 + Math.random()*14) + 'px';
      el.style.opacity = 0.15 + Math.random()*0.35;
      const duration = 14 + Math.random()*18;
      el.style.animationDuration = duration + 's';
      el.style.animationDelay = (-Math.random()*duration) + 's';
      field.appendChild(el);
    }
  }
 
  renderProducts();
  initSnow();
</script>
 
</body>
</html>
